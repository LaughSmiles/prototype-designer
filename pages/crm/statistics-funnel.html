<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售漏斗 - 芋道管理后台</title>
    <script src="../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../lib/css/all.min.css">
    <link rel="stylesheet" href="../../css/sidebar-menu.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
        .sidebar { width: 210px; height: 100vh; background: #001529; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100; }
        .sidebar .logo { height: 50px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar .logo .logo-icon { width: 32px; height: 32px; border-radius: 6px; background: #409eff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .sidebar .logo .logo-text { color: #fff; font-size: 14px; font-weight: 600; margin-left: 10px; }
        .menu-group-title { color: rgba(255,255,255,0.35); font-size: 12px; padding: 16px 16px 4px; }
        .menu-item { display: flex; align-items: center; padding: 10px 16px; color: rgba(255,255,255,0.65); cursor: pointer; transition: all 0.2s; text-decoration: none; white-space: nowrap; overflow: hidden; font-size: 13px; }
        .menu-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .menu-item.active { color: #fff; background: #409eff; }
        .menu-item i { width: 20px; text-align: center; font-size: 14px; flex-shrink: 0; }
        .menu-item span { margin-left: 10px; }
        .topbar { height: 50px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: fixed; top: 0; left: 210px; right: 0; z-index: 99; }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .avatar { width: 30px; height: 30px; border-radius: 50%; background: #409eff; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; }
        .main-content { margin-left: 210px; margin-top: 50px; padding: 16px; min-height: calc(100vh - 50px); }
        .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #909399; margin-bottom: 12px; }
        .breadcrumb a { color: #606266; text-decoration: none; }
        .breadcrumb a:hover { color: #409eff; }
        .search-card { background: #fff; border-radius: 4px; padding: 18px 20px; margin-bottom: 12px; }
        .search-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
        .search-item { display: flex; flex-direction: column; gap: 4px; }
        .search-item label { font-size: 13px; color: #606266; }
        .form-input { padding: 7px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; width: 180px; outline: none; }
        .form-input:focus { border-color: #409eff; }
        .form-select { padding: 7px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; background: #fff; width: 180px; outline: none; }
        .form-select:focus { border-color: #409eff; }
        .search-btns { display: flex; gap: 8px; align-items: flex-end; }
        .btn { padding: 7px 15px; border-radius: 4px; font-size: 13px; cursor: pointer; border: 1px solid #dcdfe6; background: #fff; color: #606266; display: inline-flex; align-items: center; gap: 4px; }
        .btn:hover { border-color: #409eff; color: #409eff; }
        .btn-primary { background: #409eff; border-color: #409eff; color: #fff; }
        .btn-primary:hover { background: #66b1ff; border-color: #66b1ff; }
        .card { background: #fff; border-radius: 4px; padding: 20px; margin-bottom: 12px; }
        .tab-bar { display: flex; border-bottom: 2px solid #e4e7ed; margin-bottom: 16px; }
        .tab-item { padding: 10px 20px; font-size: 14px; color: #909399; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab-item:hover { color: #409eff; }
        .tab-item.active { color: #409eff; border-bottom-color: #409eff; }
        .funnel-chart { display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .funnel-level { display: flex; align-items: center; margin: 4px 0; position: relative; }
        .funnel-bar { height: 50px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 14px; }
        .funnel-label { width: 120px; text-align: right; padding-right: 16px; font-size: 13px; color: #606266; }
        .funnel-value { width: 120px; padding-left: 16px; font-size: 13px; color: #909399; }
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
        .stat-card { background: #fff; border-radius: 4px; padding: 20px; text-align: center; }
        .stat-card .stat-value { font-size: 28px; font-weight: 600; color: #303133; }
        .stat-card .stat-label { font-size: 13px; color: #909399; margin-top: 4px; }
    </style>
</head>
<body>
    <!-- 左侧菜单 - 动态菜单 -->
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-cube text-white text-sm"></i></div>
            <span class="logo-text">芋道管理后台</span>
        </div>
        <div id="sidebar-menu"></div>
        <script src="../../menu/menu.js"></script>
        <script src="../../js/menu/menu-data.js"></script>
        <script src="../../js/menu/menu-render.js"></script>
        <script src="../../js/menu/menu-interaction.js"></script>
        <script src="../../js/menu/menu.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', async function() {
                try {
                    await SidebarMenu.init('sidebar-menu');
                } catch (error) {
                    console.error('动态菜单初始化失败:', error);
                }
            });
        </script>
    </div>

    <div class="topbar">
        <div class="topbar-left">
            <span class="topbar-collapse" title="折叠菜单"><i class="fas fa-outdent" style="font-size: 16px; color: #606266; cursor: pointer;"></i></span>
            <span style="font-size: 13px; color: #606266;">CRM 系统 / 销售漏斗</span>
        </div>
        <div class="topbar-right">
            <span title="全屏" style="cursor: pointer;"><i class="fas fa-expand" style="font-size: 14px; color: #606266;"></i></span>
            <span title="搜索" style="cursor: pointer;"><i class="fas fa-search" style="font-size: 14px; color: #606266;"></i></span>
            <div style="position: relative; cursor: pointer;">
                <i class="fas fa-bell" style="font-size: 16px; color: #606266;"></i>
                <span style="position: absolute; top: -6px; right: -8px; background: #f56c6c; color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 8px;">3</span>
            </div>
            <div class="dropdown">
                <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;" onclick="var m=this.nextElementSibling;m.style.display=m.style.display==='block'?'none':'block'">
                    <div class="avatar">芋</div>
                    <span style="font-size: 13px; color: #606266;">芋道源码</span>
                    <i class="fas fa-chevron-down" style="font-size: 10px; color: #909399;"></i>
                </div>
                <div class="dropdown-menu" style="right: 0; left: auto;">
                    <a><i class="fas fa-tools" style="margin-right: 6px;"></i>个人中心</a>
                    <a><i class="fas fa-book" style="margin-right: 6px;"></i>文档</a>
                    <a><i class="fas fa-lock" style="margin-right: 6px;"></i>锁定屏幕</a>
                    <a class="danger"><i class="fas fa-sign-out-alt" style="margin-right: 6px;"></i>退出登录</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <div class="breadcrumb">
            <a href="../home.html">首页</a>
            <span>/</span>
            <span>CRM 系统</span>
            <span>/</span>
            <span style="color: #303133;">销售漏斗</span>
        </div>

        <!-- 搜索栏 -->
        <div class="search-card">
            <div class="search-row">
                <div class="search-item">
                    <label>时间范围</label>
                    <input type="date" class="form-input" style="width: 160px;" value="2026-04-15">
                </div>
                <div class="search-item">
                    <label>时间间隔</label>
                    <select class="form-select">
                        <option value="1">天</option>
                        <option value="2" selected>周</option>
                        <option value="3">月</option>
                        <option value="4">季度</option>
                        <option value="5">年</option>
                    </select>
                </div>
                <div class="search-item">
                    <label>归属部门</label>
                    <select class="form-select">
                        <option value="">请选择归属部门</option>
                        <option value="1">深圳总公司</option>
                        <option value="2">长沙分公司</option>
                    </select>
                </div>
                <div class="search-item">
                    <label>员工</label>
                    <select class="form-select">
                        <option value="">全部员工</option>
                        <option value="1">芋道源码</option>
                        <option value="2">张三</option>
                        <option value="3">李四</option>
                    </select>
                </div>
                <div class="search-btns">
                    <button class="btn btn-primary"><i class="fas fa-search"></i> 查询</button>
                    <button class="btn"><i class="fas fa-redo"></i> 重置</button>
                </div>
            </div>
        </div>

        <!-- Tab 切换 -->
        <div class="card">
            <div class="tab-bar">
                <div class="tab-item active">销售漏斗分析</div>
                <div class="tab-item">新增商机分析</div>
                <div class="tab-item">商机转化率分析</div>
            </div>

            <!-- 统计卡片 -->
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-value" style="color: #409eff;">128</div>
                    <div class="stat-label">商机总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: #67c23a;">56</div>
                    <div class="stat-label">赢单商机</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: #e6a23c;">43.75%</div>
                    <div class="stat-label">总转化率</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: #f56c6c;">72</div>
                    <div class="stat-label">进行中商机</div>
                </div>
            </div>

            <!-- 漏斗图 -->
            <div class="funnel-chart">
                <div class="funnel-level">
                    <div class="funnel-label">线索</div>
                    <div class="funnel-bar" style="width: 500px; background: #409eff;">128</div>
                    <div class="funnel-value">100%</div>
                </div>
                <div class="funnel-level">
                    <div class="funnel-label">初步沟通</div>
                    <div class="funnel-bar" style="width: 430px; background: #66b1ff;">96</div>
                    <div class="funnel-value">75%</div>
                </div>
                <div class="funnel-level">
                    <div class="funnel-label">需求确认</div>
                    <div class="funnel-bar" style="width: 360px; background: #85ce61;">78</div>
                    <div class="funnel-value">60.9%</div>
                </div>
                <div class="funnel-level">
                    <div class="funnel-label">方案报价</div>
                    <div class="funnel-bar" style="width: 290px; background: #e6a23c;">65</div>
                    <div class="funnel-value">50.8%</div>
                </div>
                <div class="funnel-level">
                    <div class="funnel-label">谈判审核</div>
                    <div class="funnel-bar" style="width: 220px; background: #ebb563;">58</div>
                    <div class="funnel-value">45.3%</div>
                </div>
                <div class="funnel-level">
                    <div class="funnel-label">赢单</div>
                    <div class="funnel-bar" style="width: 150px; background: #67c23a;">56</div>
                    <div class="funnel-value">43.75%</div>
                </div>
                <div class="funnel-level">
                    <div class="funnel-label">输单</div>
                    <div class="funnel-bar" style="width: 100px; background: #f56c6c;">38</div>
                    <div class="funnel-value">29.7%</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
