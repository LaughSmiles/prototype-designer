<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 无权限 - 芋道管理后台</title>
    <script src="../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../lib/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
        }
        .error-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            padding: 12px 32px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn-primary:hover {
            background: #66b1ff;
        }
        .error-icon-wrapper {
            position: relative;
            display: inline-block;
        }
        .error-icon-wrapper .shield-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }
        .error-code {
            font-size: 120px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
            .topbar { height: 50px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; padding: 0; position: fixed; top: 0; left: 210px; right: 0; z-index: 99; }
        .topbar-left { display: flex; align-items: center; height: 100%; }
        .topbar-right { display: flex; align-items: center; height: 100%; }
        .custom-hover { display: flex; height: 100%; padding: 0 10px; cursor: pointer; align-items: center; transition: background 0.2s; }
        .custom-hover:hover { background-color: #f6f6f6; }
        .breadcrumb { display: flex; align-items: center; height: 100%; margin-left: 10px; font-size: 14px; }
        .breadcrumb-sep { margin: 0 6px; color: #c0c4cc; }
        .breadcrumb a { color: inherit; text-decoration: none; }
        .breadcrumb a:hover { color: #409eff; }
        .breadcrumb .last { color: #97a8be; }
        .notification-dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; background: #f56c6c; border-radius: 50%; }
        .avatar { width: 25px; height: 25px; border-radius: 50%; background: #409eff; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 600; }
        .username-text { padding-left: 5px; font-size: 14px; color: inherit; }
    
        .tenant-select { width: 180px; height: 32px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 0 30px 0 12px; font-size: 13px; color: #606266; background: #fff; outline: none; cursor: pointer; appearance: auto; }
        .tenant-select:focus { border-color: #409eff; }
        .tenant-wrap { position: relative; display: flex; align-items: center; margin-right: 4px; }
        .tenant-wrap i { position: absolute; right: 10px; font-size: 12px; color: #c0c4cc; pointer-events: none; }
    </style>
</head>
<body>
    <div class="min-h-screen flex">
        <!-- 左侧装饰区域 -->
        <div class="hidden lg:flex lg:w-1/2 error-bg relative p-12 overflow-hidden">
            <div class="relative z-10">
                <!-- Logo 和标题 -->
                <div class="flex items-center text-white mb-12">
                    <div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center mr-4">
                        <i class="fas fa-cube text-blue-600 text-xl"></i>
                    </div>
                    <span class="text-2xl font-bold">芋道管理后台</span>
                </div>

                <!-- 错误插图区域 -->
                <div class="h-[calc(100%-120px)] flex items-center justify-center">
                    <div class="text-center float-animation">
                        <div class="mb-8 relative">
                            <div class="shield-bg"></div>
                            <i class="fas fa-shield-alt text-white text-8xl opacity-80 relative z-10"></i>
                        </div>
                        <h2 class="text-3xl text-white font-bold mb-4">访问受限</h2>
                        <p class="text-white text-opacity-80 text-lg">您没有权限访问此页面</p>
                    </div>
                </div>
            </div>

            <!-- 装饰背景 -->
            <div class="absolute inset-0 opacity-10">
                <div class="absolute top-20 left-20 w-40 h-40 bg-white rounded-full"></div>
                <div class="absolute bottom-20 right-20 w-60 h-60 bg-white rounded-full"></div>
                <div class="absolute top-1/2 left-1/2 w-80 h-80 bg-white rounded-full -translate-x-1/2 -translate-y-1/2"></div>
            </div>
        </div>

        <!-- 右侧错误信息区域 -->
        <div class="flex-1 flex items-center justify-center p-8 bg-white">
            <div class="w-full max-w-md text-center">
                <!-- 移动端 Logo -->
                <div class="lg:hidden flex items-center justify-center mb-8">
                    <div class="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center mr-3">
                        <i class="fas fa-cube text-white text-xl"></i>
                    </div>
                    <span class="text-xl font-bold text-gray-800">芋道管理后台</span>
                </div>

                <!-- 错误内容 -->
                <div class="bg-white rounded-2xl shadow-xl p-8">
                    <!-- 错误图标 -->
                    <div class="mb-6">
                        <div class="w-24 h-24 mx-auto bg-red-50 rounded-full flex items-center justify-center mb-4">
                            <i class="fas fa-lock text-red-400 text-4xl"></i>
                        </div>
                    </div>

                    <!-- 错误代码 -->
                    <div class="error-code mb-2">403</div>

                    <!-- 错误标题 -->
                    <h3 class="text-xl font-bold text-gray-800 mb-3">抱歉，您无权访问此页面。</h3>

                    <!-- 错误描述 -->
                    <p class="text-gray-500 mb-8 text-sm leading-relaxed">
                        您当前的角色权限不足以访问该资源。<br>
                        如需访问，请联系管理员分配相应权限。
                    </p>

                    <!-- 操作按钮 -->
                    <div class="flex flex-col sm:flex-row gap-3 justify-center">
                        <a href="../home.html" class="btn-primary justify-center">
                            <i class="fas fa-home mr-2"></i>返回首页
                        </a>
                        <button onclick="history.back()" class="inline-flex items-center justify-center px-8 py-3 border border-gray-300 rounded text-gray-600 hover:bg-gray-50 transition-colors text-sm cursor-pointer bg-white">
                            <i class="fas fa-arrow-left mr-2"></i>返回上页
                        </button>
                    </div>
                </div>

                <!-- 底部信息 -->
                <div class="mt-8 text-center text-sm text-gray-400">
                    <p>© 2024 芋道管理后台 - All Rights Reserved</p>
                </div>
            </div>
        </div>
    </div>
<script src="../../js/topbar.js"></script>
<script src="../../js/prototype-components.js"></script>
</body>
</html>
