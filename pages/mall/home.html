<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商城首页 - 芋道管理后台</title>
    <script src="../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../lib/css/all.min.css">
    <link rel="stylesheet" href="../../css/sidebar-menu.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
        .sidebar { width: 210px; height: 100vh; background: #001529; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100; }
        .sidebar .logo { height: 50px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar .logo .logo-icon { width: 32px; height: 32px; border-radius: 6px; background: #409eff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .sidebar .logo .logo-text { color: #fff; font-size: 14px; font-weight: 600; margin-left: 10px; }
        .menu-item { display: flex; align-items: center; padding: 10px 16px; color: rgba(255,255,255,0.65); cursor: pointer; transition: all 0.2s; text-decoration: none; white-space: nowrap; overflow: hidden; font-size: 13px; }
        .menu-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .menu-item.active { color: #fff; background: #409eff; }
        .menu-item i { width: 20px; text-align: center; font-size: 14px; flex-shrink: 0; }
        .menu-item span { margin-left: 10px; }
        .main-content { margin-left: 210px; margin-top: 50px; padding: 16px; min-height: calc(100vh - 50px); }
                                .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
        .stat-card { background: #fff; border-radius: 4px; padding: 20px; }
        .stat-card .label { font-size: 13px; color: #909399; margin-bottom: 8px; }
        .stat-card .value { font-size: 24px; font-weight: 600; color: #303133; }
        .stat-card .compare { font-size: 12px; color: #909399; margin-top: 8px; }
        .stat-card .compare .up { color: #67c23a; }
        .stat-card .compare .down { color: #f56c6c; }
        .stat-card .tag { display: inline-block; background: #ecf5ff; color: #409eff; font-size: 11px; padding: 2px 6px; border-radius: 3px; margin-bottom: 6px; }
        .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .info-card { background: #fff; border-radius: 4px; padding: 20px; }
        .info-card .card-title { font-size: 15px; font-weight: 500; color: #303133; margin-bottom: 16px; }
        .shortcut-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .shortcut-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px; border-radius: 4px; cursor: pointer; }
        .shortcut-item:hover { background: #f5f7fa; }
        .shortcut-item .icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
        .shortcut-item .text { font-size: 12px; color: #606266; }
        .data-list { display: flex; flex-direction: column; gap: 10px; }
        .data-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .data-item .name { font-size: 13px; color: #606266; }
        .data-item .val { font-size: 13px; color: #303133; font-weight: 500; }
        .chart-placeholder { background: #fafafa; border: 1px dashed #dcdfe6; border-radius: 4px; height: 200px; display: flex; align-items: center; justify-content: center; color: #909399; font-size: 13px; }
            .topbar { height: 50px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; padding: 0; position: fixed; top: 0; left: 210px; right: 0; z-index: 99; }
        .topbar-left { display: flex; align-items: center; height: 100%; }
        .topbar-right { display: flex; align-items: center; height: 100%; }
        .custom-hover { display: flex; height: 100%; padding: 0 10px; cursor: pointer; align-items: center; transition: background 0.2s; }
        .custom-hover:hover { background-color: #f6f6f6; }
        .breadcrumb { display: flex; align-items: center; height: 100%; margin-left: 10px; font-size: 14px; }
        .breadcrumb-sep { margin: 0 6px; color: #c0c4cc; }
        .breadcrumb a { color: inherit; text-decoration: none; }
        .breadcrumb a:hover { color: #409eff; }
        .breadcrumb .last { color: #97a8be; }
        .notification-dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; background: #f56c6c; border-radius: 50%; }
        .avatar { width: 25px; height: 25px; border-radius: 50%; background: #409eff; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 600; }
        .username-text { padding-left: 5px; font-size: 14px; color: inherit; }
    
        .tenant-select { width: 180px; height: 32px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 0 30px 0 12px; font-size: 13px; color: #606266; background: #fff; outline: none; cursor: pointer; appearance: auto; }
        .tenant-select:focus { border-color: #409eff; }
        .tenant-wrap { position: relative; display: flex; align-items: center; margin-right: 4px; }
        .tenant-wrap i { position: absolute; right: 10px; font-size: 12px; color: #c0c4cc; pointer-events: none; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar"><div class="logo"><div class="logo-icon"><i class="fas fa-cube text-white text-sm"></i></div><span class="logo-text">芋道管理后台</span></div><div id="sidebar-menu"></div><script src="../../menu/menu.js"></script><script src="../../js/menu/menu-data.js"></script><script src="../../js/menu/menu-render.js"></script><script src="../../js/menu/menu-interaction.js"></script><script src="../../js/menu/menu.js"></script><script>document.addEventListener('DOMContentLoaded', async function() { try { await SidebarMenu.init('sidebar-menu'); } catch (e) { console.error(e); } });</script></div>
    <div class="topbar">
        <div class="topbar-left">
            <div class="custom-hover" title="折叠菜单"><i class="fas fa-outdent" style="font-size: 18px;"></i></div>
            <div class="breadcrumb"><span class="last">商城首页</span></div>
        </div>
                <div class="topbar-right">
            <div class="tenant-wrap">
                <select class="tenant-select">
                    <option value="" disabled selected>请选择租户</option>
                    <option value="1">芋道源码</option>
                    <option value="2">测试租户</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="custom-hover" title="全屏"><i class="fas fa-expand" style="font-size: 18px;"></i></div>
            <div class="custom-hover" title="搜索"><i class="fas fa-search" style="font-size: 18px;"></i></div>
            <div class="dropdown custom-hover" title="尺寸">
                <i class="fas fa-text-height" style="font-size: 18px;"></i>
                <div class="dropdown-menu" style="right: 0; left: auto; min-width: 120px;">
                    <a>Default</a>
                    <a>Large</a>
                    <a>Small</a>
                </div>
            </div>
            <div class="dropdown custom-hover" title="语言">
                <i class="fas fa-language" style="font-size: 18px;"></i>
                <div class="dropdown-menu" style="right: 0; left: auto; min-width: 120px;">
                    <a>简体中文</a>
                    <a>English</a>
                </div>
            </div>
            <div class="custom-hover" style="position: relative;" title="消息">
                <i class="fas fa-bell" style="font-size: 18px;"></i>
                <span class="notification-dot"></span>
            </div>
            <div class="dropdown custom-hover">
                <div style="display: flex; align-items: center; cursor: pointer;" onclick="var m=this.nextElementSibling;m.style.display=m.style.display==='block'?'none':'block'">
                    <div class="avatar">芋</div>
                    <span class="username-text">芋道源码</span>
                    <i class="fas fa-chevron-down" style="font-size: 10px; color: #909399;"></i>
                </div>
                <div class="dropdown-menu" style="right: 0; left: auto;">
                    <a><i class="fas fa-tools" style="margin-right: 6px;"></i>个人中心</a>
                    <a><i class="fas fa-book" style="margin-right: 6px;"></i>开发文档</a>
                    <a><i class="fas fa-lock" style="margin-right: 6px;"></i>锁定屏幕</a>
                    <a class="danger"><i class="fas fa-sign-out-alt" style="margin-right: 6px;"></i>退出登录</a>
                </div>
            </div>
        </div>
    </div>
<script src="../../js/topbar.js"></script>
<script src="../../js/prototype-components.js"></script>
</body>
</html>
