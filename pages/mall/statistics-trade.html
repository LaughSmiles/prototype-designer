<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易统计 - 芋道管理后台</title>
    <script src="../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../lib/css/all.min.css">
    <link rel="stylesheet" href="../../css/sidebar-menu.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
        .sidebar { width: 210px; height: 100vh; background: #001529; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100; }
        .sidebar .logo { height: 50px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar .logo .logo-icon { width: 32px; height: 32px; border-radius: 6px; background: #409eff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .sidebar .logo .logo-text { color: #fff; font-size: 14px; font-weight: 600; margin-left: 10px; }
        .menu-item { display: flex; align-items: center; padding: 10px 16px; color: rgba(255,255,255,0.65); cursor: pointer; transition: all 0.2s; text-decoration: none; white-space: nowrap; overflow: hidden; font-size: 13px; }
        .menu-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .menu-item.active { color: #fff; background: #409eff; }
        .menu-item i { width: 20px; text-align: center; font-size: 14px; flex-shrink: 0; }
        .menu-item span { margin-left: 10px; }
                .topbar { height: 50px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; padding: 0; position: fixed; top: 0; left: 210px; right: 0; z-index: 99; }
        .custom-hover { display: flex; height: 100%; padding: 0 10px; cursor: pointer; align-items: center; transition: background 0.2s; }
        .custom-hover:hover { background-color: #f6f6f6; }
        .breadcrumb { display: flex; align-items: center; height: 100%; margin-left: 10px; font-size: 14px; }
        .breadcrumb-sep { margin: 0 6px; color: #c0c4cc; }
        .breadcrumb a { color: inherit; text-decoration: none; }
        .breadcrumb a:hover { color: #409eff; }
        .breadcrumb .last { color: #97a8be; }
        .notification-dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; background: #f56c6c; border-radius: 50%; }
        .username-text { padding-left: 5px; font-size: 14px; color: inherit; }
                .avatar { width: 25px; height: 25px; border-radius: 50%; background: #409eff; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 600; }
        .main-content { margin-left: 210px; margin-top: 50px; padding: 16px; min-height: calc(100vh - 50px); }
                                .stat-row { display: flex; gap: 16px; margin-bottom: 16px; }
        .stat-card { background: #fff; border-radius: 8px; padding: 20px; flex: 1; display: flex; align-items: center; }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-right: 16px; }
        .stat-value { font-size: 26px; font-weight: 700; color: #303133; }
        .stat-label { font-size: 13px; color: #909399; margin-top: 4px; }
        .stat-change { font-size: 12px; margin-top: 2px; }
        .stat-change.up { color: #67c23a; }
        .stat-change.down { color: #f56c6c; }
        .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .card-title { font-size: 15px; font-weight: 600; color: #303133; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #ebeef5; }
        .chart-placeholder { height: 400px; background: #fafafa; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #c0c4cc; font-size: 14px; border: 1px dashed #dcdfe6; }
        .detail-row { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
        .detail-card { flex: 1; min-width: 180px; background: #fafafa; border-radius: 6px; padding: 16px; display: flex; align-items: center; gap: 12px; }
        .detail-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .detail-value { font-size: 18px; font-weight: 600; color: #303133; }
        .detail-label { font-size: 12px; color: #909399; }
            .dropdown { position: relative; display: inline-block; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 100%; background: #fff; border: 1px solid #ebeef5; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,.1); z-index: 10; min-width: 100px; padding: 4px 0; }
        .dropdown-menu a { display: block; padding: 6px 16px; font-size: 13px; color: #606266; text-decoration: none; cursor: pointer; }
        .dropdown-menu a:hover { background: #ecf5ff; color: #409eff; }
        .dropdown-menu a.danger:hover { background: #fef0f0; color: #f56c6c; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="logo"><div class="logo-icon"><i class="fas fa-cube text-white text-sm"></i></div><span class="logo-text">芋道管理后台</span></div>
        <div id="sidebar-menu"></div>
        <script src="../../menu/menu.js"></script>
        <script src="../../js/menu/menu-data.js"></script>
        <script src="../../js/menu/menu-render.js"></script>
        <script src="../../js/menu/menu-interaction.js"></script>
        <script src="../../js/menu/menu.js"></script>
        <script>document.addEventListener('DOMContentLoaded', async function(){ try{await SidebarMenu.init('sidebar-menu');}catch(e){console.error(e);} });</script>
    </div>
    <div class="topbar">
        <div class="topbar-left">
            <div class="custom-hover" title="折叠菜单"><i class="fas fa-outdent" style="font-size: 18px;"></i></div>
            <div class="breadcrumb"><a>商城系统</a><span class="breadcrumb-sep">/</span><span class="last">交易统计</span></div>
        </div>
        <div class="topbar-right">
            <div class="custom-hover" title="全屏"><i class="fas fa-expand" style="font-size: 18px;"></i></div>
            <div class="custom-hover" title="搜索"><i class="fas fa-search" style="font-size: 18px;"></i></div>
            <div class="custom-hover" style="position: relative;" title="消息">
                <i class="fas fa-bell" style="font-size: 18px;"></i>
                <span class="notification-dot"></span>
            </div>
            <div class="dropdown custom-hover">
                <div style="display: flex; align-items: center; cursor: pointer;" onclick="var m=this.nextElementSibling;m.style.display=m.style.display==='block'?'none':'block'">
                    <div class="avatar">芋</div>
                    <span class="username-text">芋道源码</span>
                    <i class="fas fa-chevron-down" style="font-size: 10px; color: #909399;"></i>
                </div>
                <div class="dropdown-menu" style="right: 0; left: auto;">
                    <a><i class="fas fa-tools" style="margin-right: 6px;"></i>个人中心</a>
                    <a><i class="fas fa-book" style="margin-right: 6px;"></i>文档</a>
                    <a><i class="fas fa-lock" style="margin-right: 6px;"></i>锁定屏幕</a>
                    <a class="danger"><i class="fas fa-sign-out-alt" style="margin-right: 6px;"></i>退出登录</a>
                </div>
            </div>
        </div>
    </div>
            <div class="stat-card"><div class="stat-icon" style="background:#f5f3ff;color:#8b5cf6;"><i class="fas fa-calendar-check"></i></div><div><div class="stat-value">35,680</div><div class="stat-label">本月订单数量</div><div class="stat-change up"><i class="fas fa-arrow-up"></i> 8.3%</div></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#fffbeb;color:#f59e0b;"><i class="fas fa-yen-sign"></i></div><div><div class="stat-value">286,500.00</div><div class="stat-label">昨日支付金额</div><div class="stat-change down"><i class="fas fa-arrow-down"></i> 3.2%</div></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#ecfdf5;color:#10b981;"><i class="fas fa-wallet"></i></div><div><div class="stat-value">8,560,200.00</div><div class="stat-label">本月支付金额</div><div class="stat-change up"><i class="fas fa-arrow-up"></i> 15.8%</div></div></div>
        </div>

        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #ebeef5;">
                <div class="card-title" style="border:none;margin:0;padding:0;">交易状况</div>
                <div style="display:flex;gap:8px;align-items:center;">
                    <select style="padding:6px 12px;border:1px solid #dcdfe6;border-radius:4px;font-size:13px;"><option>最近7天</option><option>最近30天</option><option>本月</option><option>上月</option></select>
                    <button style="padding:6px 14px;border-radius:4px;font-size:13px;cursor:pointer;border:1px solid #dcdfe6;background:#fff;"><i class="fas fa-download"></i> 导出</button>
                </div>
            </div>
            <div class="detail-row">
                <div class="detail-card"><div class="detail-icon" style="background:#eff6ff;color:#3b82f6;"><i class="fas fa-yen-sign"></i></div><div><div class="detail-value">2,156,800</div><div class="detail-label">营业额</div></div></div>
                <div class="detail-card"><div class="detail-icon" style="background:#f5f3ff;color:#8b5cf6;"><i class="fas fa-shopping-cart"></i></div><div><div class="detail-value">1,856,300</div><div class="detail-label">商品支付金额</div></div></div>
                <div class="detail-card"><div class="detail-icon" style="background:#fffbeb;color:#f59e0b;"><i class="fas fa-money-check-alt"></i></div><div><div class="detail-value">300,500</div><div class="detail-label">充值金额</div></div></div>
                <div class="detail-card"><div class="detail-icon" style="background:#ecfdf5;color:#10b981;"><i class="fas fa-exclamation-triangle"></i></div><div><div class="detail-value">156,200</div><div class="detail-label">支出金额</div></div></div>
                <div class="detail-card"><div class="detail-icon" style="background:#ecfeff;color:#06b6d4;"><i class="fas fa-wallet"></i></div><div><div class="detail-value">89,600</div><div class="detail-label">余额支付金额</div></div></div>
                <div class="detail-card"><div class="detail-icon" style="background:#fffbeb;color:#f59e0b;"><i class="fas fa-award"></i></div><div><div class="detail-value">35,200</div><div class="detail-label">支付佣金金额</div></div></div>
                <div class="detail-card"><div class="detail-icon" style="background:#eff6ff;color:#3b82f6;"><i class="fas fa-times-circle"></i></div><div><div class="detail-value">31,400</div><div class="detail-label">商品退款金额</div></div></div>
            </div>
            <div class="chart-placeholder" style="margin-top:20px;"><i class="fas fa-chart-line" style="margin-right:8px;"></i>交易状况折线图（营业额、商品支付金额、充值金额、支出金额）</div>
        </div>
    </div>
</body>
</html>
