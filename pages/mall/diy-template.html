<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>装修模板 - 芋道管理后台</title>
    <script src="../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../lib/css/all.min.css">
    <link rel="stylesheet" href="../../lib/tailwindcss/tailwind.min.css">
    <style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
.sidebar { width: 210px; height: 100vh; background: #001529; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100; }
.sidebar .logo { height: 50px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.sidebar .logo .logo-icon { width: 32px; height: 32px; border-radius: 6px; background: #409eff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sidebar .logo .logo-text { color: #fff; font-size: 14px; font-weight: 600; margin-left: 10px; }
.menu-group-title { color: rgba(255,255,255,0.35); font-size: 12px; padding: 16px 16px 4px; }
.menu-item { display: flex; align-items: center; padding: 10px 16px; color: rgba(255,255,255,0.65); cursor: pointer; transition: all 0.2s; text-decoration: none; white-space: nowrap; overflow: hidden; font-size: 13px; }
.menu-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
.menu-item.active { color: #fff; background: #409eff; }
.menu-item i { width: 20px; text-align: center; font-size: 14px; flex-shrink: 0; }
.menu-item span { margin-left: 10px; }
.main-content { margin-left: 210px; margin-top: 50px; padding: 16px; min-height: calc(100vh - 50px); }
.search-card { background: #fff; border-radius: 4px; padding: 18px 20px; margin-bottom: 12px; }
.search-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.search-item { display: flex; flex-direction: column; gap: 4px; }
.search-item label { font-size: 13px; color: #606266; }
.form-input { padding: 7px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; width: 180px; outline: none; }
.form-input:focus { border-color: #409eff; }
.form-select { padding: 7px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; background: #fff; width: 180px; outline: none; }
.search-btns { display: flex; gap: 8px; align-items: flex-end; }
.table-card { background: #fff; border-radius: 4px; padding: 16px; }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #ebeef5; font-size: 13px; }
th { background: #fafafa; color: #909399; font-weight: 500; white-space: nowrap; }
tr:hover { background: #f5f7fa; }
.btn { padding: 7px 15px; border-radius: 4px; font-size: 13px; cursor: pointer; border: 1px solid #dcdfe6; background: #fff; color: #606266; display: inline-flex; align-items: center; gap: 4px; }
.btn:hover { border-color: #409eff; color: #409eff; }
.btn-primary { background: #409eff; border-color: #409eff; color: #fff; }
.btn-text { border: none; background: none; color: #409eff; padding: 0 4px; cursor: pointer; font-size: 13px; }
.btn-text.danger { color: #f56c6c; }
.status-tag { padding: 2px 8px; border-radius: 3px; font-size: 12px; display: inline-block; }
.status-success { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
.status-danger { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
.status-info { background: #ecf5ff; color: #409eff; border: 1px solid #d9ecff; }
.status-warning { background: #fdf6ec; color: #e6a23c; border: 1px solid #faecd8; }
.pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 13px; color: #606266; }
.pagination .page-btns { display: flex; gap: 4px; }
.pagination .page-btn { padding: 4px 10px; border: 1px solid #dcdfe6; border-radius: 3px; cursor: pointer; font-size: 13px; background: #fff; }
.pagination .page-btn.active { background: #409eff; color: #fff; border-color: #409eff; }
.phone-frame { width: 375px; height: 680px; border: 2px solid #dcdfe6; border-radius: 20px; margin: 0 auto; background: #fff; overflow: hidden; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.phone-notch { width: 150px; height: 25px; background: #001529; border-radius: 0 0 15px 15px; margin: 0 auto; }
.phone-content { padding: 10px; height: calc(100% - 25px); overflow-y: auto; }
.phone-banner { width: 100%; height: 140px; background: linear-gradient(135deg, #409eff, #67c23a); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; margin-bottom: 10px; }
.phone-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.phone-grid-item { text-align: center; font-size: 11px; color: #606266; }
.phone-grid-item .icon { width: 40px; height: 40px; border-radius: 10px; margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
.phone-product { display: flex; gap: 8px; padding: 8px; background: #f5f7fa; border-radius: 6px; margin-bottom: 8px; }
.phone-product img { width: 70px; height: 70px; background: #e8e8e8; border-radius: 4px; }
.phone-product .info { flex: 1; }
.phone-product .name { font-size: 12px; color: #303133; margin-bottom: 4px; }
.phone-product .price { font-size: 14px; color: #f56c6c; font-weight: 600; }
.component-list { background: #fff; border-radius: 4px; padding: 12px; }
.component-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid #ebeef5; border-radius: 4px; margin-bottom: 6px; cursor: pointer; font-size: 13px; color: #606266; }
.component-item:hover { border-color: #409eff; color: #409eff; }
.component-item i { width: 20px; text-align: center; color: #409eff; }
            .dropdown { position: relative; display: inline-block; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 100%; background: #fff; border: 1px solid #ebeef5; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,.1); z-index: 10; min-width: 100px; padding: 4px 0; }
        .dropdown-menu a { display: block; padding: 6px 16px; font-size: 13px; color: #606266; text-decoration: none; cursor: pointer; }
        .dropdown-menu a:hover { background: #ecf5ff; color: #409eff; }
        .dropdown-menu a.danger:hover { background: #fef0f0; color: #f56c6c; }
            .topbar { height: 50px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; padding: 0; position: fixed; top: 0; left: 210px; right: 0; z-index: 99; }
        .topbar-left { display: flex; align-items: center; height: 100%; }
        .topbar-right { display: flex; align-items: center; height: 100%; }
        .custom-hover { display: flex; height: 100%; padding: 0 10px; cursor: pointer; align-items: center; transition: background 0.2s; }
        .custom-hover:hover { background-color: #f6f6f6; }
        .breadcrumb { display: flex; align-items: center; height: 100%; margin-left: 10px; font-size: 14px; }
        .breadcrumb-sep { margin: 0 6px; color: #c0c4cc; }
        .breadcrumb a { color: inherit; text-decoration: none; }
        .breadcrumb a:hover { color: #409eff; }
        .breadcrumb .last { color: #97a8be; }
        .notification-dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; background: #f56c6c; border-radius: 50%; }
        .avatar { width: 25px; height: 25px; border-radius: 50%; background: #409eff; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 600; }
        .username-text { padding-left: 5px; font-size: 14px; color: inherit; }
    
        .tenant-select { width: 180px; height: 32px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 0 30px 0 12px; font-size: 13px; color: #606266; background: #fff; outline: none; cursor: pointer; appearance: auto; }
        .tenant-select:focus { border-color: #409eff; }
        .tenant-wrap { position: relative; display: flex; align-items: center; margin-right: 4px; }
        .tenant-wrap i { position: absolute; right: 10px; font-size: 12px; color: #c0c4cc; pointer-events: none; }
    </style>
<link rel="stylesheet" href="../../css/sidebar-menu.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-cube text-white text-sm"></i></div>
            <span class="logo-text">芋道管理后台</span>
        </div>
        <div id="sidebar-menu"></div>
        <script src="../../menu/menu.js"></script>
        <script src="../../js/menu/menu-data.js"></script>
        <script src="../../js/menu/menu-render.js"></script>
        <script src="../../js/menu/menu-interaction.js"></script>
        <script src="../../js/menu/menu.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', async function() {
                try { await SidebarMenu.init('sidebar-menu'); } catch (error) {
                    console.error('菜单加载失败:', error);
                }
            });
        </script>
    </div>

    <div class="topbar">
        <div class="topbar-left">
            <div class="custom-hover" title="折叠菜单"><i class="fas fa-outdent" style="font-size: 18px;"></i></div>
            <div class="breadcrumb"><a>商城管理</a><span class="breadcrumb-sep">/</span><a>营销中心</a><span class="breadcrumb-sep">/</span><span class="last">装修模板</span></div>
        </div>
                <div class="topbar-right">
            <div class="tenant-wrap">
                <select class="tenant-select">
                    <option value="" disabled selected>请选择租户</option>
                    <option value="1">芋道源码</option>
                    <option value="2">测试租户</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="custom-hover" title="全屏"><i class="fas fa-expand" style="font-size: 18px;"></i></div>
            <div class="custom-hover" title="搜索"><i class="fas fa-search" style="font-size: 18px;"></i></div>
            <div class="dropdown custom-hover" title="尺寸">
                <i class="fas fa-text-height" style="font-size: 18px;"></i>
                <div class="dropdown-menu" style="right: 0; left: auto; min-width: 120px;">
                    <a>Default</a>
                    <a>Large</a>
                    <a>Small</a>
                </div>
            </div>
            <div class="dropdown custom-hover" title="语言">
                <i class="fas fa-language" style="font-size: 18px;"></i>
                <div class="dropdown-menu" style="right: 0; left: auto; min-width: 120px;">
                    <a>简体中文</a>
                    <a>English</a>
                </div>
            </div>
            <div class="custom-hover" style="position: relative;" title="消息">
                <i class="fas fa-bell" style="font-size: 18px;"></i>
                <span class="notification-dot"></span>
            </div>
            <div class="dropdown custom-hover">
                <div style="display: flex; align-items: center; cursor: pointer;" onclick="var m=this.nextElementSibling;m.style.display=m.style.display==='block'?'none':'block'">
                    <div class="avatar">芋</div>
                    <span class="username-text">芋道源码</span>
                    <i class="fas fa-chevron-down" style="font-size: 10px; color: #909399;"></i>
                </div>
                <div class="dropdown-menu" style="right: 0; left: auto;">
                    <a><i class="fas fa-tools" style="margin-right: 6px;"></i>个人中心</a>
                    <a><i class="fas fa-book" style="margin-right: 6px;"></i>开发文档</a>
                    <a><i class="fas fa-lock" style="margin-right: 6px;"></i>锁定屏幕</a>
                    <a class="danger"><i class="fas fa-sign-out-alt" style="margin-right: 6px;"></i>退出登录</a>
                </div>
            </div>
        </div>
    </div>
    <div class="main-content">
        <div style="display: flex; gap: 16px;">
            <!-- 左侧组件列表 -->
            <div style="width: 200px; flex-shrink: 0;">
                <div class="component-list">
                    <div style="font-size: 13px; font-weight: 600; color: #303133; margin-bottom: 10px;">可用组件</div>
                    <div class="component-item"><i class="fas fa-image"></i>轮播图</div>
                    <div class="component-item"><i class="fas fa-th"></i>导航图标</div>
                    <div class="component-item"><i class="fas fa-search"></i>搜索框</div>
                    <div class="component-item"><i class="fas fa-box"></i>商品列表</div>
                    <div class="component-item"><i class="fas fa-tags"></i>优惠券</div>
                    <div class="component-item"><i class="fas fa-bullhorn"></i>公告栏</div>
                    <div class="component-item"><i class="fas fa-video"></i>视频组件</div>
                    <div class="component-item"><i class="fas fa-ruler-horizontal"></i>辅助空白</div>
                </div>
            </div>
            <!-- 中间手机预览 -->
            <div style="flex: 1; display: flex; justify-content: center;">
                <div class="phone-frame">
                    <div class="phone-notch"></div>
                    <div class="phone-content">
                        <div class="phone-banner">春季大促 限时特惠</div>
                        <div class="phone-grid">
                            <div class="phone-grid-item"><div class="icon" style="background: #409eff;"><i class="fas fa-bolt"></i></div>秒杀</div>
                            <div class="phone-grid-item"><div class="icon" style="background: #f56c6c;"><i class="fas fa-percentage"></i></div>折扣</div>
                            <div class="phone-grid-item"><div class="icon" style="background: #e6a23c;"><i class="fas fa-gift"></i></div>满减</div>
                            <div class="phone-grid-item"><div class="icon" style="background: #67c23a;"><i class="fas fa-ticket-alt"></i></div>领券</div>
                            <div class="phone-grid-item"><div class="icon" style="background: #909399;"><i class="fas fa-handshake"></i></div>砍价</div>
                            <div class="phone-grid-item"><div class="icon" style="background: #b37feb;"><i class="fas fa-coins"></i></div>积分</div>
                            <div class="phone-grid-item"><div class="icon" style="background: #ff85c0;"><i class="fas fa-user"></i></div>个人</div>
                            <div class="phone-grid-item"><div class="icon" style="background: #36cfc9;"><i class="fas fa-ellipsis-h"></i></div>更多</div>
                        </div>
                        <div class="phone-product"><div style="width: 70px; height: 70px; background: #e8e8e8; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #c0c4cc;"><i class="fas fa-image"></i></div><div class="info"><div class="name">iPhone 16 Pro Max 256GB</div><div class="price">¥9,999</div><div style="font-size: 11px; color: #909399; margin-top: 2px;">已售 1,205</div></div></div>
                        <div class="phone-product"><div style="width: 70px; height: 70px; background: #e8e8e8; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #c0c4cc;"><i class="fas fa-image"></i></div><div class="info"><div class="name">MacBook Air M4 512GB</div><div class="price">¥8,999</div><div style="font-size: 11px; color: #909399; margin-top: 2px;">已售 856</div></div></div>
                        <div class="phone-product"><div style="width: 70px; height: 70px; background: #e8e8e8; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #c0c4cc;"><i class="fas fa-image"></i></div><div class="info"><div class="name">Sony WH-1000XM5 蓝牙耳机</div><div class="price">¥2,499</div><div style="font-size: 11px; color: #909399; margin-top: 2px;">已售 1,560</div></div></div>
                    </div>
                </div>
            </div>
            <!-- 右侧属性面板 -->
            <div style="width: 240px; flex-shrink: 0;">
                <div class="component-list">
                    <div style="font-size: 13px; font-weight: 600; color: #303133; margin-bottom: 10px;">页面设置</div>
                    <div class="search-item"><label>页面名称</label><input type="text" class="form-input" value="首页模板" style="width: 100%;"></div>
                    <div class="search-item" style="margin-top: 8px;"><label>页面描述</label><input type="text" class="form-input" value="商城首页装修模板" style="width: 100%;"></div>
                    <div class="search-item" style="margin-top: 8px;"><label>状态</label><select class="form-select" style="width: 100%;"><option>已发布</option><option>未发布</option></select></div>
                    <div style="margin-top: 12px; display: flex; gap: 8px;"><button class="btn btn-primary" style="width: 100%; justify-content: center;"><i class="fas fa-save"></i> 保存模板</button></div>
                    <button class="btn" style="width: 100%; justify-content: center; margin-top: 6px;"><i class="fas fa-eye"></i> 预览</button>
                </div>
            </div>
        </div>
    </div>
<script src="../../js/topbar.js"></script>
<script src="../../js/prototype-components.js"></script>
</body>
</html>
