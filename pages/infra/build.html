<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单构建 - 芋道管理后台</title>
    <script src="../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../lib/css/all.min.css">
    <link rel="stylesheet" href="../../css/sidebar-menu.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
        .sidebar { width: 210px; height: 100vh; background: #001529; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100; }
        .sidebar .logo { height: 50px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar .logo .logo-icon { width: 32px; height: 32px; border-radius: 6px; background: #409eff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .sidebar .logo .logo-text { color: #fff; font-size: 14px; font-weight: 600; margin-left: 10px; }
        .menu-group-title { color: rgba(255,255,255,0.35); font-size: 12px; padding: 16px 16px 4px; }
        .menu-item { display: flex; align-items: center; padding: 10px 16px; color: rgba(255,255,255,0.65); cursor: pointer; transition: all 0.2s; text-decoration: none; white-space: nowrap; overflow: hidden; font-size: 13px; }
        .menu-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .menu-item.active { color: #fff; background: #409eff; }
        .menu-item i { width: 20px; text-align: center; font-size: 14px; flex-shrink: 0; }
        .menu-item span { margin-left: 10px; }
        .topbar { height: 50px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: fixed; top: 0; left: 210px; right: 0; z-index: 99; }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .avatar { width: 30px; height: 30px; border-radius: 50%; background: #409eff; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; }
        .main-content { margin-left: 210px; margin-top: 50px; padding: 0; min-height: calc(100vh - 50px); }
                                .designer-wrap { display: flex; height: calc(100vh - 50px - 40px); padding: 0 16px 16px; gap: 0; }
        .designer-left { width: 260px; background: #fff; border-radius: 4px; overflow-y: auto; flex-shrink: 0; }
        .designer-center { flex: 1; background: #fff; margin: 0 8px; border-radius: 4px; overflow-y: auto; min-width: 0; }
        .designer-right { width: 300px; background: #fff; border-radius: 4px; overflow-y: auto; flex-shrink: 0; }
        .panel-title { font-size: 14px; font-weight: 600; padding: 12px 16px; border-bottom: 1px solid #ebeef5; color: #303133; }
        .comp-group { padding: 8px 12px; }
        .comp-group-title { font-size: 12px; color: #909399; margin-bottom: 8px; }
        .comp-item { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 70px; height: 64px; border: 1px solid #e8e8e8; border-radius: 4px; cursor: pointer; margin: 0 4px 4px 0; font-size: 12px; color: #606266; transition: all 0.2s; }
        .comp-item:hover { border-color: #409eff; color: #409eff; }
        .comp-item i { font-size: 20px; margin-bottom: 4px; }
        .form-canvas { padding: 20px; min-height: 300px; }
        .form-canvas-item { padding: 12px; border: 1px dashed transparent; margin-bottom: 8px; border-radius: 4px; position: relative; }
        .form-canvas-item:hover { border-color: #409eff; background: #f5f7fa; }
        .form-canvas-item .item-label { font-size: 13px; color: #606266; margin-bottom: 6px; }
        .form-canvas-item .item-input { padding: 7px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; width: 100%; background: #fafafa; color: #c0c4cc; }
        .prop-section { padding: 12px 16px; border-bottom: 1px solid #ebeef5; }
        .prop-section-title { font-size: 13px; font-weight: 600; color: #303133; margin-bottom: 8px; }
        .prop-row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
        .prop-label { font-size: 12px; color: #606266; width: 80px; flex-shrink: 0; }
        .prop-input { flex: 1; padding: 5px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 12px; outline: none; }
        .prop-input:focus { border-color: #409eff; }
        .btn { padding: 7px 15px; border-radius: 4px; font-size: 13px; cursor: pointer; border: 1px solid #dcdfe6; background: #fff; color: #606266; display: inline-flex; align-items: center; gap: 4px; }
        .btn-primary { background: #409eff; border-color: #409eff; color: #fff; }
        .btn-success { background: #67c23a; border-color: #67c23a; color: #fff; }
        .btn-danger { background: #f56c6c; border-color: #f56c6c; color: #fff; }
        .toolbar-bar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 8px 16px; border-bottom: 1px solid #ebeef5; background: #fafafa; border-radius: 4px 4px 0 0; }
            .dropdown { position: relative; display: inline-block; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 100%; background: #fff; border: 1px solid #ebeef5; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,.1); z-index: 10; min-width: 100px; padding: 4px 0; }
        .dropdown-menu a { display: block; padding: 6px 16px; font-size: 13px; color: #606266; text-decoration: none; cursor: pointer; }
        .dropdown-menu a:hover { background: #ecf5ff; color: #409eff; }
        .dropdown-menu a.danger:hover { background: #fef0f0; color: #f56c6c; }
    </style>
</head>
<body>
    <!-- 左侧菜单 -->
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-cube text-white text-sm"></i></div>
            <span class="logo-text">芋道管理后台</span>
        </div>
        <div id="sidebar-menu"></div>
        <script src="../../menu/menu.js"></script>
        <script src="../../js/menu/menu-data.js"></script>
        <script src="../../js/menu/menu-render.js"></script>
        <script src="../../js/menu/menu-interaction.js"></script>
        <script src="../../js/menu/menu.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', async function() {
                try { await SidebarMenu.init('sidebar-menu'); } catch (error) { console.error('菜单初始化失败:', error); }
            });
        </script>
    </div>

    <div class="topbar">
        <div class="topbar-left">
            <span class="topbar-collapse" title="折叠菜单"><i class="fas fa-outdent" style="font-size: 16px; color: #606266; cursor: pointer;"></i></span>
            <span style="font-size: 13px; color: #606266;">基础设施 / 表单构建</span>
        </div>
        <div class="topbar-right">
            <span title="全屏" style="cursor: pointer;"><i class="fas fa-expand" style="font-size: 14px; color: #606266;"></i></span>
            <span title="搜索" style="cursor: pointer;"><i class="fas fa-search" style="font-size: 14px; color: #606266;"></i></span>
            <div style="position: relative; cursor: pointer;">
                <i class="fas fa-bell" style="font-size: 16px; color: #606266;"></i>
                <span style="position: absolute; top: -6px; right: -8px; background: #f56c6c; color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 8px;">3</span>
            </div>
            <div class="dropdown">
                <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;" onclick="var m=this.nextElementSibling;m.style.display=m.style.display==='block'?'none':'block'">
                    <div class="avatar">芋</div>
                    <span style="font-size: 13px; color: #606266;">芋道源码</span>
                    <i class="fas fa-chevron-down" style="font-size: 10px; color: #909399;"></i>
                </div>
                <div class="dropdown-menu" style="right: 0; left: auto;">
                    <a><i class="fas fa-tools" style="margin-right: 6px;"></i>个人中心</a>
                    <a><i class="fas fa-book" style="margin-right: 6px;"></i>文档</a>
                    <a><i class="fas fa-lock" style="margin-right: 6px;"></i>锁定屏幕</a>
                    <a class="danger"><i class="fas fa-sign-out-alt" style="margin-right: 6px;"></i>退出登录</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <div class="designer-wrap">
            <!-- 左侧组件面板 -->
            <div class="designer-left">
                <div class="panel-title">组件库</div>
                <div class="comp-group">
                    <div class="comp-group-title">基础字段</div>
                    <div class="comp-item"><i class="fas fa-font"></i>单行文本</div>
                    <div class="comp-item"><i class="fas fa-align-left"></i>多行文本</div>
                    <div class="comp-item"><i class="fas fa-hashtag"></i>数字</div>
                    <div class="comp-item"><i class="fas fa-list"></i>下拉选择</div>
                    <div class="comp-item"><i class="fas fa-toggle-on"></i>开关</div>
                    <div class="comp-item"><i class="fas fa-calendar"></i>日期</div>
                    <div class="comp-item"><i class="fas fa-clock"></i>时间</div>
                    <div class="comp-item"><i class="fas fa-image"></i>图片</div>
                </div>
                <div class="comp-group">
                    <div class="comp-group-title">高级字段</div>
                    <div class="comp-item"><i class="fas fa-table"></i>表格</div>
                    <div class="comp-item"><i class="fas fa-tags"></i>标签</div>
                    <div class="comp-item"><i class="fas fa-star"></i>评分</div>
                    <div class="comp-item"><i class="fas fa-sliders-h"></i>滑块</div>
                    <div class="comp-item"><i class="fas fa-file-upload"></i>文件上传</div>
                    <div class="comp-item"><i class="fas fa-map-marker-alt"></i>地址</div>
                </div>
                <div class="comp-group">
                    <div class="comp-group-title">布局字段</div>
                    <div class="comp-item"><i class="fas fa-columns"></i>栅格</div>
                    <div class="comp-item"><i class="fas fa-th-large"></i>标签页</div>
                    <div class="comp-item"><i class="fas fa-minus"></i>分割线</div>
                    <div class="comp-item"><i class="fas fa-info-circle"></i>提示</div>
                </div>
            </div>

            <!-- 中间画布 -->
            <div class="designer-center">
                <div class="toolbar-bar">
                    <button class="btn btn-primary"><i class="fas fa-code"></i> 生成JSON</button>
                    <button class="btn btn-success"><i class="fas fa-cog"></i> 生成Options</button>
                    <button class="btn btn-danger"><i class="fas fa-puzzle-piece"></i> 生成组件</button>
                </div>
                <div class="form-canvas">
                    <div class="form-canvas-item">
                        <div class="item-label">用户名 <span style="color: #f56c6c;">*</span></div>
                        <div class="item-input">请输入用户名</div>
                    </div>
                    <div class="form-canvas-item">
                        <div class="item-label">手机号</div>
                        <div class="item-input">请输入手机号</div>
                    </div>
                    <div class="form-canvas-item">
                        <div class="item-label">性别</div>
                        <div class="item-input">请选择性别</div>
                    </div>
                    <div class="form-canvas-item">
                        <div class="item-label">出生日期</div>
                        <div class="item-input">请选择日期</div>
                    </div>
                    <div class="form-canvas-item">
                        <div class="item-label">备注</div>
                        <div class="item-input" style="height: 60px;">请输入备注信息</div>
                    </div>
                </div>
            </div>

            <!-- 右侧属性面板 -->
            <div class="designer-right">
                <div class="panel-title">组件属性</div>
                <div class="prop-section">
                    <div class="prop-section-title">基础属性</div>
                    <div class="prop-row">
                        <span class="prop-label">字段标识</span>
                        <input class="prop-input" value="username">
                    </div>
                    <div class="prop-row">
                        <span class="prop-label">标题</span>
                        <input class="prop-input" value="用户名">
                    </div>
                    <div class="prop-row">
                        <span class="prop-label">占位内容</span>
                        <input class="prop-input" value="请输入用户名">
                    </div>
                    <div class="prop-row">
                        <span class="prop-label">默认值</span>
                        <input class="prop-input" value="">
                    </div>
                </div>
                <div class="prop-section">
                    <div class="prop-section-title">校验规则</div>
                    <div class="prop-row">
                        <span class="prop-label">是否必填</span>
                        <input type="checkbox" checked>
                    </div>
                    <div class="prop-row">
                        <span class="prop-label">最大长度</span>
                        <input class="prop-input" value="20">
                    </div>
                    <div class="prop-row">
                        <span class="prop-label">最小长度</span>
                        <input class="prop-input" value="0">
                    </div>
                </div>
                <div class="prop-section">
                    <div class="prop-section-title">表单属性</div>
                    <div class="prop-row">
                        <span class="prop-label">标签宽度</span>
                        <input class="prop-input" value="100px">
                    </div>
                    <div class="prop-row">
                        <span class="prop-label">组件宽度</span>
                        <input class="prop-input" value="100%">
                    </div>
                    <div class="prop-row">
                        <span class="prop-label">是否禁用</span>
                        <input type="checkbox">
                    </div>
                    <div class="prop-row">
                        <span class="prop-label">是否只读</span>
                        <input type="checkbox">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
