<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签到配置 - 芋道管理后台</title>
    <script src="../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../lib/css/all.min.css">
    <link rel="stylesheet" href="../../css/sidebar-menu.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
        .sidebar { width: 210px; height: 100vh; background: #001529; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100; }
        .sidebar .logo { height: 50px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar .logo .logo-icon { width: 32px; height: 32px; border-radius: 6px; background: #409eff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .sidebar .logo .logo-text { color: #fff; font-size: 14px; font-weight: 600; margin-left: 10px; }
        .menu-item { display: flex; align-items: center; padding: 10px 16px; color: rgba(255,255,255,0.65); cursor: pointer; transition: all 0.2s; text-decoration: none; white-space: nowrap; overflow: hidden; font-size: 13px; }
        .menu-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .menu-item.active { color: #fff; background: #409eff; }
        .menu-item i { width: 20px; text-align: center; font-size: 14px; flex-shrink: 0; }
        .menu-item span { margin-left: 10px; }
        .topbar { height: 50px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: fixed; top: 0; left: 210px; right: 0; z-index: 99; }
        .avatar { width: 30px; height: 30px; border-radius: 50%; background: #409eff; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; }
        .main-content { margin-left: 210px; margin-top: 50px; padding: 16px; min-height: calc(100vh - 50px); }
        .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #909399; margin-bottom: 12px; }
        .breadcrumb a { color: #606266; text-decoration: none; }
        .breadcrumb a:hover { color: #409eff; }
        .table-card { background: #fff; border-radius: 4px; padding: 16px; }
        .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #ebeef5; font-size: 13px; }
        th { background: #fafafa; color: #909399; font-weight: 500; white-space: nowrap; }
        tr:hover { background: #f5f7fa; }
        .btn { padding: 7px 15px; border-radius: 4px; font-size: 13px; cursor: pointer; border: 1px solid #dcdfe6; background: #fff; color: #606266; display: inline-flex; align-items: center; gap: 4px; }
        .btn-primary { background: #409eff; border-color: #409eff; color: #fff; }
        .btn-text { border: none; background: none; color: #409eff; padding: 0 4px; cursor: pointer; font-size: 13px; }
        .btn-text.danger { color: #f56c6c; }
        .pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 13px; color: #606266; }
        .pagination .page-btns { display: flex; gap: 4px; }
        .pagination .page-btn { padding: 4px 10px; border: 1px solid #dcdfe6; border-radius: 3px; cursor: pointer; font-size: 13px; background: #fff; }
        .pagination .page-btn.active { background: #409eff; color: #fff; border-color: #409eff; }
        .status-tag { padding: 2px 8px; border-radius: 3px; font-size: 12px; display: inline-block; }
        .status-success { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
        .status-danger { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar"><div class="logo"><div class="logo-icon"><i class="fas fa-cube text-white text-sm"></i></div><span class="logo-text">芋道管理后台</span></div><div id="sidebar-menu"></div><script src="../../menu/menu.js"></script><script src="../../js/menu/menu-data.js"></script><script src="../../js/menu/menu-render.js"></script><script src="../../js/menu/menu-interaction.js"></script><script src="../../js/menu/menu.js"></script><script>document.addEventListener('DOMContentLoaded', async function() { try { await SidebarMenu.init('sidebar-menu'); } catch (e) { console.error(e); } });</script></div>
    <div class="topbar">
        <div class="topbar-left">
            <span class="topbar-collapse" title="折叠菜单"><i class="fas fa-outdent" style="font-size: 16px; color: #606266; cursor: pointer;"></i></span>
            <span style="font-size: 13px; color: #606266;">会员管理 / 签到配置</span>
        </div>
        <div class="topbar-right">
            <span title="全屏" style="cursor: pointer;"><i class="fas fa-expand" style="font-size: 14px; color: #606266;"></i></span>
            <span title="搜索" style="cursor: pointer;"><i class="fas fa-search" style="font-size: 14px; color: #606266;"></i></span>
            <div style="position: relative; cursor: pointer;">
                <i class="fas fa-bell" style="font-size: 16px; color: #606266;"></i>
                <span style="position: absolute; top: -6px; right: -8px; background: #f56c6c; color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 8px;">3</span>
            </div>
            <div class="dropdown">
                <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;" onclick="var m=this.nextElementSibling;m.style.display=m.style.display==='block'?'none':'block'">
                    <div class="avatar">芋</div>
                    <span style="font-size: 13px; color: #606266;">芋道源码</span>
                    <i class="fas fa-chevron-down" style="font-size: 10px; color: #909399;"></i>
                </div>
                <div class="dropdown-menu" style="right: 0; left: auto;">
                    <a><i class="fas fa-tools" style="margin-right: 6px;"></i>个人中心</a>
                    <a><i class="fas fa-book" style="margin-right: 6px;"></i>文档</a>
                    <a><i class="fas fa-lock" style="margin-right: 6px;"></i>锁定屏幕</a>
                    <a class="danger"><i class="fas fa-sign-out-alt" style="margin-right: 6px;"></i>退出登录</a>
                </div>
            </div>
        </div>
    </div>
    <div class="main-content">
        <div class="breadcrumb"><a href="../home.html">首页</a><span>/</span><span>会员管理</span><span>/</span><span style="color: #303133;">签到配置</span></div>
        <div class="table-card">
            <div class="toolbar"><button class="btn btn-primary"><i class="fas fa-plus"></i> 新增</button></div>
            <table>
                <thead><tr><th>签到天数</th><th>奖励积分</th><th>奖励经验</th><th>状态</th><th style="width: 120px;">操作</th></tr></thead>
                <tbody>
                    <tr><td>第 1 天</td><td>10</td><td>5</td><td><span class="status-tag status-success">开启</span></td><td><button class="btn-text">编辑</button><button class="btn-text danger">删除</button></td></tr>
                    <tr><td>第 2 天</td><td>15</td><td>8</td><td><span class="status-tag status-success">开启</span></td><td><button class="btn-text">编辑</button><button class="btn-text danger">删除</button></td></tr>
                    <tr><td>第 3 天</td><td>20</td><td>10</td><td><span class="status-tag status-success">开启</span></td><td><button class="btn-text">编辑</button><button class="btn-text danger">删除</button></td></tr>
                    <tr><td>第 5 天</td><td>50</td><td>25</td><td><span class="status-tag status-success">开启</span></td><td><button class="btn-text">编辑</button><button class="btn-text danger">删除</button></td></tr>
                    <tr><td>第 7 天</td><td>100</td><td>50</td><td><span class="status-tag status-danger">关闭</span></td><td><button class="btn-text">编辑</button><button class="btn-text danger">删除</button></td></tr>
                </tbody>
            </table>
            <div class="pagination"><span>共 5 条</span><div class="page-btns"><button class="page-btn"><i class="fas fa-chevron-left"></i></button><button class="page-btn active">1</button><button class="page-btn"><i class="fas fa-chevron-right"></i></button></div></div>
        </div>
    </div>
</body>
</html>
