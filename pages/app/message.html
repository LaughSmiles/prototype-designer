<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>消息 - 拾光社区</title>
<script src="../../lib/js/tailwindcss.js"></script>
<link rel="stylesheet" href="../../lib/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 375px; height: 100%; overflow: hidden; }
  body { padding-bottom: 52px; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fff; color: #222; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .scroll::-webkit-scrollbar { width: 0; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: 52px; border-top: 1px solid #eee; display: flex; background: #fff; }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
              font-size: 10px; color: #999; text-decoration: none; gap: 2px; }
  .tabbar a.on { color: #ff2442; }
  .tabbar i { font-size: 17px; }
</style>
<!-- 框架脚本：topbar.js 提供 Esc → postMessage 的退出预览桥，移动端必需 -->
<script src="../../js/debug.js"></script>
<script src="../../js/topbar.js"></script>
</head>
<body>
<div style="display:flex; flex-direction:column; height:100vh;">

  <!-- 顶栏 -->
  <div style="flex:0 0 auto; padding:30px 14px 0;">
    <div style="display:flex; align-items:center;">
      <span style="font-size:17px; font-weight:600;">消息</span>
      <i class="far fa-circle-dot" style="font-size:19px; color:#666; margin-left:auto;"></i>
    </div>
    <!-- tabs -->
    <div style="display:flex; gap:22px; margin-top:14px;">
      <span style="font-size:14px; font-weight:600; padding-bottom:8px; border-bottom:2px solid #ff2442;">互动通知</span>
      <span style="font-size:14px; color:#888; padding-bottom:8px;">私信</span>
    </div>
    <div style="border-bottom:1px solid #f0f0f0;"></div>
  </div>

  <div class="scroll">
    <!-- 赞和收藏 -->
    <div style="padding:12px 14px 4px; display:flex; align-items:center;">
      <i class="far fa-heart" style="font-size:15px; color:#ff2442; width:20px;"></i>
      <span style="font-size:14px;">赞和收藏</span>
      <i class="fas fa-chevron-right" style="font-size:11px; color:#ccc; margin-left:auto;"></i>
    </div>
    <div style="display:flex; gap:8px; padding:8px 14px 14px;">
      <div style="position:relative;">
        <img src="../../lib/images/images_unsplash_com_photo-1624911104820-5316c700b907_750x1000.jpg"
             style="width:54px;height:72px;object-fit:cover;border-radius:4px;">
        <i class="fas fa-heart" style="position:absolute; bottom:2px; right:2px; color:#fff; font-size:12px;
           text-shadow:0 0 4px rgba(0,0,0,.5);"></i>
      </div>
      <div style="position:relative;">
        <img src="../../lib/images/images_pexels_com_photos37963517pexels-photo-37963517jpeg_750x1000.jpeg"
             style="width:54px;height:72px;object-fit:cover;border-radius:4px;">
        <i class="fas fa-heart" style="position:absolute; bottom:2px; right:2px; color:#fff; font-size:12px;
           text-shadow:0 0 4px rgba(0,0,0,.5);"></i>
      </div>
      <div style="position:relative;">
        <img src="../../lib/images/images_pexels_com_photos34864230pexels-photo-34864230jpeg_750x1000.jpeg"
             style="width:54px;height:72px;object-fit:cover;border-radius:4px;">
        <i class="fas fa-star" style="position:absolute; bottom:2px; right:2px; color:#fff; font-size:12px;
           text-shadow:0 0 4px rgba(0,0,0,.5);"></i>
      </div>
      <div style="position:relative;">
        <img src="../../lib/images/images_pexels_com_photos18060165pexels-photo-18060165jpeg_750x1000.jpeg"
             style="width:54px;height:72px;object-fit:cover;border-radius:4px;">
        <i class="fas fa-heart" style="position:absolute; bottom:2px; right:2px; color:#fff; font-size:12px;
           text-shadow:0 0 4px rgba(0,0,0,.5);"></i>
      </div>
    </div>

    <!-- 评论和回复 -->
    <div style="padding:12px 14px 4px; display:flex; align-items:center; border-top:1px solid #f5f5f5;">
      <i class="far fa-comment" style="font-size:15px; color:#666; width:20px;"></i>
      <span style="font-size:14px;">评论和回复</span>
      <span style="margin-left:auto; font-size:12px; color:#ff2442;">3 条新评论</span>
    </div>

    <a href="note-detail.html" style="display:flex; gap:9px; padding:10px 14px; text-decoration:none; color:inherit;">
      <img src="../../lib/images/images_pexels_com_photos30518441pexels-photo-30518441jpeg_200x200.jpeg"
           style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
      <div style="flex:1;">
        <div style="font-size:13px;">
          <b>橘猫饲养员</b>
          <span style="color:#666;"> 回复了你：</span>
          <span style="color:#ff2442;">求民宿地址！</span>
        </div>
        <div style="font-size:12px; color:#999; margin-top:4px;">周末去山里住了两晚，这家民宿真的绝了</div>
        <div style="font-size:11px; color:#bbb; margin-top:4px;">3 小时前</div>
      </div>
      <img src="../../lib/images/images_pexels_com_photos27667695pexels-photo-27667695jpeg_750x1000.jpeg"
           style="width:36px;height:48px;object-fit:cover;border-radius:4px;">
    </a>

    <a href="note-detail.html" style="display:flex; gap:9px; padding:10px 14px; text-decoration:none; color:inherit;">
      <img src="../../lib/images/images_pexels_com_photos38178737pexels-photo-38178737jpeg_200x200.jpeg"
           style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
      <div style="flex:1;">
        <div style="font-size:13px;">
          <b>小鹿衣柜</b>
          <span style="color:#666;"> 评论了你的笔记：</span>
        </div>
        <div style="font-size:12px; color:#999; margin-top:4px;">银河那条图能出个教程吗，想学参数</div>
        <div style="font-size:11px; color:#bbb; margin-top:4px;">昨天</div>
      </div>
      <img src="../../lib/images/images_unsplash_com_photo-1532980400857-e8d9d275d858_750x1000.jpg"
           style="width:36px;height:48px;object-fit:cover;border-radius:4px;">
    </a>

    <!-- 关注 -->
    <div style="padding:12px 14px 4px; display:flex; align-items:center; border-top:1px solid #f5f5f5;">
      <i class="fas fa-user-plus" style="font-size:15px; color:#666; width:20px;"></i>
      <span style="font-size:14px;">新增关注</span>
      <i class="fas fa-chevron-right" style="font-size:11px; color:#ccc; margin-left:auto;"></i>
    </div>

    <a href="user-home.html" style="display:flex; align-items:center; gap:9px; padding:9px 14px; text-decoration:none; color:inherit;">
      <img src="../../lib/images/images_pexels_com_photos31585831pexels-photo-31585831jpeg_200x200.jpeg"
           style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
      <div style="flex:1;">
        <div style="font-size:13px;">吃货小周</div>
        <div style="font-size:11px; color:#999;">关注了你</div>
      </div>
      <span style="font-size:12px; color:#999;">刚刚</span>
    </a>

    <a href="user-home.html" style="display:flex; align-items:center; gap:9px; padding:9px 14px; text-decoration:none; color:inherit;">
      <img src="../../lib/images/images_pexels_com_photos30494318pexels-photo-30494318jpeg_200x200.jpeg"
           style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
      <div style="flex:1;">
        <div style="font-size:13px;">晨跑少女</div>
        <div style="font-size:11px; color:#999;">关注了你</div>
      </div>
      <span style="font-size:12px; color:#999;">2 天前</span>
    </a>

    <!-- 私信入口 -->
    <div style="padding:16px 14px 28px;">
      <div style="font-size:13px; font-weight:600; margin-bottom:10px;">私信</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <a href="user-home.html" style="width:52px; text-align:center; text-decoration:none; color:inherit;">
          <img src="../../lib/images/images_pexels_com_photos34630594pexels-photo-34630594jpeg_200x200.jpeg"
               style="width:46px;height:46px;border-radius:50%;object-fit:cover;">
          <div style="font-size:10px; color:#999; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">山野拾光</div>
        </a>
        <a href="user-home.html" style="width:52px; text-align:center; text-decoration:none; color:inherit;">
          <img src="../../lib/images/images_pexels_com_photos39842783pexels-photo-39842783jpeg_200x200.jpeg"
               style="width:46px;height:46px;border-radius:50%;object-fit:cover;">
          <div style="font-size:10px; color:#999; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">租房改造记</div>
        </a>
        <a href="user-home.html" style="width:52px; text-align:center; text-decoration:none; color:inherit;">
          <img src="../../lib/images/images_pexels_com_photos30518441pexels-photo-30518441jpeg_200x200.jpeg"
               style="width:46px;height:46px;border-radius:50%;object-fit:cover;">
          <div style="font-size:10px; color:#999; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">橘猫饲养员</div>
        </a>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a href="discover.html"><i class="fas fa-compass"></i>发现</a>
    <a href="publish.html"><i class="fas fa-plus-square"></i>发布</a>
    <a href="message.html" class="on"><i class="far fa-comment-dots"></i>消息</a>
    <a href="profile.html"><i class="fas fa-user"></i>我</a>
  </nav>

</div>
</body>
</html>
