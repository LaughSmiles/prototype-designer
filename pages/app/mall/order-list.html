<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单</title>
    <script src="../../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../../lib/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6f8; overflow-x: hidden; padding-bottom: 56px; }
        .status-bar { background: rgba(255,255,255,.95); padding: 12px 20px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; position: sticky; top: 0; z-index: 20; }
        .status-bar .icons { display: flex; gap: 5px; font-size: 12px; }
        .nav { background: #fff; padding: 8px 16px 0; position: sticky; top: 38px; z-index: 20; }
        .nav .bar { display: flex; align-items: center; justify-content: space-between; }
        .nav h3 { font-size: 17px; font-weight: 600; color: #1f2937; }
        .nav i { color: #4b5563; font-size: 17px; }
        .tabs { display: flex; margin-top: 6px; }
        .tabs a { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; color: #6b7280; text-decoration: none; position: relative; }
        .tabs a.on { color: #ff6b81; font-weight: 600; }
        .tabs a.on::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 22px; height: 2px; background: #ff6b81; border-radius: 1px; }
        .order { background: #fff; border-radius: 10px; margin: 10px 12px; padding: 12px 14px; }
        .order-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #1f2937; margin-bottom: 10px; }
        .order-head i { color: #ff6b81; }
        .order-head .st { margin-left: auto; font-size: 12px; }
        .st.wait { color: #ff6b81; }
        .st.done { color: #9aa0a6; }
        .order-item { display: flex; gap: 10px; padding: 8px 0; }
        .order-item + .order-item { border-top: 1px solid #f7f8fa; }
        .thumb { width: 64px; height: 64px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; flex-shrink: 0; }
        .oi-info { flex: 1; min-width: 0; }
        .oi-info .name { font-size: 13px; color: #1f2937; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .oi-info .spec { display: inline-block; background: #f5f6f8; color: #9aa0a6; font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-top: 5px; }
        .oi-price { text-align: right; font-size: 13px; color: #1f2937; }
        .oi-price .q { color: #9aa0a6; font-size: 12px; }
        .order-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 10px; border-top: 1px solid #f7f8fa; margin-top: 4px; }
        .order-foot .sum { margin-right: auto; font-size: 12px; color: #6b7280; }
        .order-foot .sum b { color: #ff6b81; font-size: 16px; font-weight: 700; }
        .btn { border: 1px solid #dcdfe6; background: #fff; color: #4b5563; border-radius: 15px; padding: 5px 14px; font-size: 12px; }
        .btn.primary { background: #ff6b81; border-color: #ff6b81; color: #fff; }
        .btn.ghost { border-color: #ff6b81; color: #ff6b81; }
        .tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; background: rgba(255,255,255,.97); border-top: 1px solid #eceef1; display: flex; z-index: 30; }
        .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; color: #9aa0a6; text-decoration: none; }
        .tabbar a i { font-size: 18px; }
        .tabbar a.on { color: #ff6b81; }
        .tabbar .badge { position: absolute; top: 8px; margin-left: 14px; background: #ff6b81; color: #fff; font-size: 9px; border-radius: 8px; padding: 0 4px; line-height: 14px; }
    </style>
</head>
<body>
    <div class="status-bar">
        <span>9:41</span>
        <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
    </div>

    <div class="nav">
        <div class="bar">
            <i class="fas fa-chevron-left"></i>
            <h3>我的订单</h3>
            <i class="fas fa-search"></i>
        </div>
        <div class="tabs">
            <a href="order-list.html" class="on">全部</a>
            <a href="order-list.html">待付款</a>
            <a href="order-list.html">待发货</a>
            <a href="order-list.html">待收货</a>
            <a href="order-list.html">已完成</a>
        </div>
    </div>

    <div class="order">
        <div class="order-head">
            <i class="fas fa-store"></i><span>星辰官方旗舰店</span>
            <span class="st wait">待付款</span>
        </div>
        <div class="order-item">
            <div class="thumb" style="background:linear-gradient(135deg,#a1c4fd,#c2e9fb);"><i class="fas fa-mobile-alt"></i></div>
            <div class="oi-info"><div class="name">星辰 Pro 智能手机 12+256G 全网通 5G</div><span class="spec">幻夜黑 · 12+256G</span></div>
            <div class="oi-price">¥3299<div class="q">×1</div></div>
        </div>
        <div class="order-item">
            <div class="thumb" style="background:linear-gradient(135deg,#ffecd2,#fcb69f);"><i class="fas fa-headphones"></i></div>
            <div class="oi-info"><div class="name">静音降噪蓝牙耳机 Air Pro</div><span class="spec">云雾白 · 标准版</span></div>
            <div class="oi-price">¥899<div class="q">×2</div></div>
        </div>
        <div class="order-foot">
            <span class="sum">实付 <b>¥5096.9</b></span>
            <button class="btn">取消订单</button>
            <button class="btn primary">立即付款</button>
        </div>
    </div>

    <div class="order">
        <div class="order-head">
            <i class="fas fa-store"></i><span>星辰官方旗舰店</span>
            <span class="st wait">待收货</span>
        </div>
        <div class="order-item">
            <div class="thumb" style="background:linear-gradient(135deg,#e0c3fc,#8ec5fc);"><i class="fas fa-clock"></i></div>
            <div class="oi-info"><div class="name">星辰智能手表 S2 血氧监测 运动款</div><span class="spec">曜石黑 · 46mm</span></div>
            <div class="oi-price">¥1299<div class="q">×1</div></div>
        </div>
        <div class="order-foot">
            <span class="sum">实付 <b>¥1299</b></span>
            <button class="btn">查看物流</button>
            <button class="btn ghost">确认收货</button>
        </div>
    </div>

    <div class="order">
        <div class="order-head">
            <i class="fas fa-store"></i><span>优选食品旗舰店</span>
            <span class="st done">已完成</span>
        </div>
        <div class="order-item">
            <div class="thumb" style="background:linear-gradient(135deg,#d4fc79,#96e6a1);"><i class="fas fa-apple-alt"></i></div>
            <div class="oi-info"><div class="name">阿克苏冰糖心苹果 5 斤装 顺丰冷链</div><span class="spec">5 斤 / 箱</span></div>
            <div class="oi-price">¥49.9<div class="q">×1</div></div>
        </div>
        <div class="order-foot">
            <span class="sum">实付 <b>¥49.9</b></span>
            <button class="btn">再次购买</button>
            <button class="btn">评价晒单</button>
        </div>
    </div>

    <div class="tabbar">
        <a href="home.html"><i class="fas fa-home"></i><span>首页</span></a>
        <a href="category.html"><i class="fas fa-th-large"></i><span>分类</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span>购物车</span><span class="badge">3</span></a>
        <a href="order-list.html" class="on"><i class="fas fa-file-alt"></i><span>订单</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span>我的</span></a>
    </div>
    <!-- 框架脚本：topbar.js 提供 Esc → postMessage 的退出预览桥，移动端必需 -->
    <script src="../../../js/debug.js"></script>
    <script src="../../../js/topbar.js"></script>
</body>
</html>
