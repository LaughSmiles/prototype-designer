<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情</title>
    <script src="../../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../../lib/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6f8; overflow-x: hidden; padding-bottom: 60px; }
        .status-bar { background: rgba(255,255,255,.95); padding: 12px 20px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; position: sticky; top: 0; z-index: 20; }
        .status-bar .icons { display: flex; gap: 5px; font-size: 12px; }
        .nav { background: #fff; padding: 8px 16px 12px; display: flex; align-items: center; gap: 12px; position: sticky; top: 38px; z-index: 20; }
        .nav i { color: #4b5563; font-size: 17px; }
        .gallery { height: 260px; background: linear-gradient(135deg, #a1c4fd, #c2e9fb); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 88px; }
        .price-card { background: linear-gradient(90deg, #ff6b81, #ff8fa3); padding: 14px 16px; color: #fff; display: flex; align-items: flex-end; justify-content: space-between; }
        .price-card .p { font-size: 26px; font-weight: 700; }
        .price-card .p small { font-size: 14px; }
        .price-card .old { font-size: 12px; opacity: .8; text-decoration: line-through; margin-left: 8px; }
        .price-card .sold { font-size: 11px; opacity: .9; }
        .block { background: #fff; padding: 14px 16px; margin-bottom: 8px; }
        .title { font-size: 16px; font-weight: 600; color: #1f2937; line-height: 1.5; }
        .sub { font-size: 12px; color: #9aa0a6; margin-top: 6px; }
        .tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .tags span { background: #fff0f3; color: #ff6b81; font-size: 11px; padding: 2px 8px; border-radius: 3px; }
        .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #4b5563; padding: 10px 0; }
        .row + .row { border-top: 1px solid #f2f3f5; }
        .row .v { color: #1f2937; }
        .row i.fa-angle-right { color: #c0c4cc; }
        .shop { display: flex; align-items: center; gap: 12px; }
        .shop .logo { width: 42px; height: 42px; border-radius: 8px; background: #409eff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .shop .info { flex: 1; }
        .shop .info h4 { font-size: 14px; color: #1f2937; }
        .shop .info p { font-size: 11px; color: #9aa0a6; margin-top: 2px; }
        .btn-sm { border: 1px solid #ff6b81; color: #ff6b81; background: #fff; border-radius: 14px; padding: 4px 14px; font-size: 12px; }
        .sec-title { font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 10px; text-align: center; }
        .detail-img { height: 110px; border-radius: 8px; background: #f5f6f8; display: flex; align-items: center; justify-content: center; color: #c0c4cc; font-size: 28px; margin-bottom: 8px; }
        .actionbar { position: fixed; left: 0; right: 0; bottom: 0; height: 60px; background: #fff; border-top: 1px solid #eceef1; display: flex; align-items: center; padding: 0 8px; gap: 6px; z-index: 30; }
        .actionbar .ic { width: 46px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: #6b7280; }
        .actionbar .ic i { font-size: 17px; }
        .actionbar .btns { flex: 1; display: flex; }
        .actionbar .btns button { flex: 1; height: 42px; border: none; color: #fff; font-size: 14px; font-weight: 600; }
        .actionbar .btns .add { background: #ffa726; border-radius: 21px 0 0 21px; }
        .actionbar .btns .buy { background: #ff6b81; border-radius: 0 21px 21px 0; }
    </style>
</head>
<body>
    <div class="status-bar">
        <span>9:41</span>
        <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
    </div>

    <div class="nav">
        <i class="fas fa-chevron-left"></i>
        <div style="flex:1; display:flex; align-items:center; gap:8px; background:#f2f3f5; border-radius:16px; padding:7px 12px; color:#9aa0a6; font-size:12px;">
            <i class="fas fa-search"></i><span>搜索商品</span>
        </div>
        <i class="fas fa-share-alt"></i>
    </div>

    <div class="gallery"><i class="fas fa-mobile-alt"></i></div>

    <div class="price-card">
        <div>
            <span class="p"><small>¥</small>3299</span>
            <span class="old">¥3999</span>
        </div>
        <span class="sold">已售 3.4 万件</span>
    </div>

    <div class="block">
        <div class="title">星辰 Pro 智能手机 12+256G 全网通 5G 双卡双待</div>
        <div class="sub">官方旗舰店 · 正品保障 · 7 天无理由退换</div>
        <div class="tags">
            <span>满 2999 减 300</span>
            <span>12 期免息</span>
            <span>顺丰包邮</span>
        </div>
    </div>

    <div class="block">
        <div class="row"><span>选择规格</span><span class="v">幻夜黑 · 12+256G <i class="fas fa-angle-right"></i></span></div>
        <div class="row"><span>配送至</span><span class="v">浙江省杭州市西湖区 <i class="fas fa-angle-right"></i></span></div>
        <div class="row"><span>服务</span><span class="v">正品保证 · 极速退款 <i class="fas fa-angle-right"></i></span></div>
    </div>

    <div class="block">
        <div class="shop">
            <div class="logo"><i class="fas fa-store"></i></div>
            <div class="info">
                <h4>星辰官方旗舰店</h4>
                <p>商品描述 4.9 · 服务态度 4.8 · 物流速度 4.9</p>
            </div>
            <button class="btn-sm">进店</button>
        </div>
    </div>

    <div class="block">
        <div class="sec-title">商品详情</div>
        <div class="detail-img"><i class="fas fa-image"></i></div>
        <div class="detail-img"><i class="fas fa-image"></i></div>
        <div style="font-size:13px; color:#6b7280; line-height:2;">
            屏幕：6.7 英寸 OLED 120Hz 高刷屏<br>
            处理器：星辰自研 X2 八核<br>
            电池：5000mAh，支持 80W 快充<br>
            相机：5000 万像素三摄
        </div>
    </div>

    <div class="actionbar">
        <div class="ic"><i class="fas fa-headset"></i><span>客服</span></div>
        <div class="ic"><i class="fas fa-store"></i><span>店铺</span></div>
        <div class="ic"><i class="fas fa-shopping-cart"></i><span>购物车</span></div>
        <div class="btns">
            <button class="add">加入购物车</button>
            <button class="buy">立即购买</button>
        </div>
    </div>
</body>
</html>
