<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品分类</title>
    <script src="../../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../../lib/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6f8; overflow: hidden; }
        .status-bar { background: rgba(255,255,255,.95); padding: 12px 20px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
        .status-bar .icons { display: flex; gap: 5px; font-size: 12px; }
        .search-bar { padding: 4px 16px 12px; background: #fff; }
        .search-box { display: flex; align-items: center; gap: 8px; background: #f2f3f5; border-radius: 18px; padding: 8px 14px; color: #9aa0a6; font-size: 13px; }
        .wrap { display: flex; height: calc(812px - 120px - 56px); }
        .side { width: 92px; background: #f5f6f8; overflow-y: auto; flex-shrink: 0; }
        .side a { display: block; padding: 15px 8px; text-align: center; font-size: 13px; color: #4b5563; text-decoration: none; border-left: 3px solid transparent; }
        .side a.on { background: #fff; color: #ff6b81; font-weight: 600; border-left-color: #ff6b81; }
        .main { flex: 1; background: #fff; overflow-y: auto; padding: 12px; }
        .banner-sm { border-radius: 8px; height: 72px; background: linear-gradient(135deg, #a1c4fd, #c2e9fb); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: #fff; margin-bottom: 14px; }
        .banner-sm h4 { font-size: 15px; font-weight: 600; }
        .banner-sm p { font-size: 11px; opacity: .9; }
        .banner-sm i { font-size: 32px; opacity: .3; }
        .grp-title { font-size: 13px; font-weight: 600; color: #1f2937; margin: 14px 0 10px; display: flex; align-items: center; gap: 6px; }
        .grp-title::before { content: ''; width: 3px; height: 12px; background: #ff6b81; border-radius: 2px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .item { text-align: center; }
        .item .thumb { height: 64px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; margin-bottom: 6px; }
        .item span { font-size: 11px; color: #4b5563; }
        .tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; background: rgba(255,255,255,.97); border-top: 1px solid #eceef1; display: flex; z-index: 30; }
        .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; color: #9aa0a6; text-decoration: none; }
        .tabbar a i { font-size: 18px; }
        .tabbar a.on { color: #ff6b81; }
        .tabbar .badge { position: absolute; top: 8px; margin-left: 14px; background: #ff6b81; color: #fff; font-size: 9px; border-radius: 8px; padding: 0 4px; line-height: 14px; }
    </style>
</head>
<body>
    <div class="status-bar">
        <span>9:41</span>
        <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
    </div>

    <div class="search-bar">
        <div class="search-box"><i class="fas fa-search"></i><span>搜索商品、品牌、店铺</span></div>
    </div>

    <div class="wrap">
        <div class="side">
            <a href="category.html" class="on">手机数码</a>
            <a href="category.html">家用电器</a>
            <a href="category.html">服饰鞋包</a>
            <a href="category.html">食品生鲜</a>
            <a href="category.html">美妆个护</a>
            <a href="category.html">家居百货</a>
            <a href="category.html">母婴玩具</a>
            <a href="category.html">运动户外</a>
            <a href="category.html">图书文娱</a>
        </div>

        <div class="main">
            <div class="banner-sm">
                <div><h4>手机数码</h4><p>以旧换新最高补贴 800 元</p></div>
                <i class="fas fa-mobile-alt"></i>
            </div>

            <div class="grp-title">热门品类</div>
            <div class="grid">
                <div class="item"><div class="thumb" style="background:linear-gradient(135deg,#a1c4fd,#c2e9fb);"><i class="fas fa-mobile-alt"></i></div><span>手机</span></div>
                <div class="item"><div class="thumb" style="background:linear-gradient(135deg,#ffecd2,#fcb69f);"><i class="fas fa-laptop"></i></div><span>笔记本</span></div>
                <div class="item"><div class="thumb" style="background:linear-gradient(135deg,#d4fc79,#96e6a1);"><i class="fas fa-headphones"></i></div><span>耳机</span></div>
            </div>

            <div class="grp-title">智能设备</div>
            <div class="grid">
                <div class="item"><div class="thumb" style="background:linear-gradient(135deg,#e0c3fc,#8ec5fc);"><i class="fas fa-clock"></i></div><span>智能手表</span></div>
                <div class="item"><div class="thumb" style="background:linear-gradient(135deg,#fbc2eb,#a6c1ee);"><i class="fas fa-camera"></i></div><span>相机</span></div>
                <div class="item"><div class="thumb" style="background:linear-gradient(135deg,#84fab0,#8fd3f4);"><i class="fas fa-tablet-alt"></i></div><span>平板</span></div>
            </div>

            <div class="grp-title">配件周边</div>
            <div class="grid">
                <div class="item"><div class="thumb" style="background:linear-gradient(135deg,#ffeaa7,#fdcb6e);"><i class="fas fa-plug"></i></div><span>充电器</span></div>
                <div class="item"><div class="thumb" style="background:linear-gradient(135deg,#a8edea,#fed6e3);"><i class="fas fa-shield-alt"></i></div><span>保护壳</span></div>
                <div class="item"><div class="thumb" style="background:linear-gradient(135deg,#ffd3a5,#fd6585);"><i class="fas fa-mouse"></i></div><span>鼠标键盘</span></div>
            </div>
        </div>
    </div>

    <div class="tabbar">
        <a href="home.html"><i class="fas fa-home"></i><span>首页</span></a>
        <a href="category.html" class="on"><i class="fas fa-th-large"></i><span>分类</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span>购物车</span><span class="badge">3</span></a>
        <a href="order-list.html"><i class="fas fa-file-alt"></i><span>订单</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span>我的</span></a>
    </div>
    <!-- 框架脚本：topbar.js 提供 Esc → postMessage 的退出预览桥，移动端必需 -->
    <script src="../../../js/debug.js"></script>
    <script src="../../../js/topbar.js"></script>
</body>
</html>
