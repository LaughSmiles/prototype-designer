<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的</title>
    <script src="../../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../../lib/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6f8; overflow-x: hidden; padding-bottom: 56px; }
        .status-bar { padding: 12px 20px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: #fff; position: absolute; top: 0; left: 0; right: 0; z-index: 20; }
        .status-bar .icons { display: flex; gap: 5px; font-size: 12px; }
        .hero { background: linear-gradient(135deg, #ff6b81, #ff9ba8); padding: 46px 20px 42px; color: #fff; border-radius: 0 0 22px 22px; }
        .user { display: flex; align-items: center; gap: 14px; }
        .avatar { width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; font-size: 26px; border: 2px solid rgba(255,255,255,.6); }
        .user .meta h3 { font-size: 18px; font-weight: 600; }
        .user .meta p { font-size: 12px; opacity: .9; margin-top: 4px; }
        .user .lvl { margin-left: auto; background: rgba(255,255,255,.22); border-radius: 12px; padding: 4px 12px; font-size: 12px; }
        .stats { display: flex; margin-top: 22px; }
        .stats div { flex: 1; text-align: center; }
        .stats b { font-size: 18px; font-weight: 700; display: block; }
        .stats span { font-size: 11px; opacity: .9; }
        .assets { background: #fff; border-radius: 12px; margin: -26px 12px 0; padding: 16px 10px; display: flex; position: relative; z-index: 5; box-shadow: 0 2px 12px rgba(0,0,0,.04); }
        .assets div { flex: 1; text-align: center; }
        .assets b { color: #ff6b81; font-size: 16px; font-weight: 700; display: block; }
        .assets span { font-size: 11px; color: #9aa0a6; }
        .card { background: #fff; border-radius: 12px; margin: 12px; overflow: hidden; }
        .card-head { display: flex; align-items: center; padding: 14px; font-size: 14px; font-weight: 600; color: #1f2937; }
        .card-head .more { margin-left: auto; font-size: 12px; color: #9aa0a6; font-weight: 400; }
        .orders { display: flex; padding: 4px 0 16px; }
        .orders a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: #6b7280; text-decoration: none; position: relative; }
        .orders a i { font-size: 20px; color: #ff6b81; }
        .orders a .dot { position: absolute; top: -4px; right: 22px; background: #ff6b81; color: #fff; font-size: 9px; border-radius: 8px; padding: 0 4px; line-height: 14px; }
        .menu a { display: flex; align-items: center; gap: 12px; padding: 14px; font-size: 14px; color: #1f2937; text-decoration: none; }
        .menu a + a { border-top: 1px solid #f7f8fa; }
        .menu a i.ico { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; }
        .menu a .arrow { margin-left: auto; color: #c0c4cc; font-size: 13px; }
        .menu a .val { margin-left: auto; color: #9aa0a6; font-size: 12px; margin-right: 6px; }
        .tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; background: rgba(255,255,255,.97); border-top: 1px solid #eceef1; display: flex; z-index: 30; }
        .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; color: #9aa0a6; text-decoration: none; }
        .tabbar a i { font-size: 18px; }
        .tabbar a.on { color: #ff6b81; }
        .tabbar .badge { position: absolute; top: 8px; margin-left: 14px; background: #ff6b81; color: #fff; font-size: 9px; border-radius: 8px; padding: 0 4px; line-height: 14px; }
    </style>
</head>
<body>
    <div class="status-bar">
        <span>9:41</span>
        <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
    </div>

    <div class="hero">
        <div class="user">
            <div class="avatar"><i class="fas fa-user"></i></div>
            <div class="meta">
                <h3>张小满</h3>
                <p>会员号 8823 4519 · 商城优选会员</p>
            </div>
            <span class="lvl"><i class="fas fa-crown"></i> 黄金</span>
        </div>
        <div class="stats">
            <div><b>12</b><span>关注商品</span></div>
            <div><b>5</b><span>收藏店铺</span></div>
            <div><b>38</b><span>我的足迹</span></div>
            <div><b>6</b><span>优惠券</span></div>
        </div>
    </div>

    <div class="assets">
        <div><b>1280</b><span>积分</span></div>
        <div><b>2</b><span>余额</span></div>
        <div><b>3</b><span>红包</span></div>
        <div><b>6</b><span>优惠券</span></div>
    </div>

    <div class="card">
        <div class="card-head">我的订单<span class="more">全部订单 <i class="fas fa-angle-right"></i></span></div>
        <div class="orders">
            <a href="order-list.html"><i class="fas fa-wallet"></i><span>待付款</span><span class="dot">1</span></a>
            <a href="order-list.html"><i class="fas fa-box"></i><span>待发货</span></a>
            <a href="order-list.html"><i class="fas fa-truck"></i><span>待收货</span><span class="dot">1</span></a>
            <a href="order-list.html"><i class="fas fa-star"></i><span>待评价</span></a>
            <a href="order-list.html"><i class="fas fa-undo"></i><span>退换货</span></a>
        </div>
    </div>

    <div class="card menu">
        <a href="cart.html"><i class="ico" style="background:#ff8a8a;"><i class="fas fa-shopping-cart"></i></i><span>购物车</span><span class="val">3 件商品</span><i class="fas fa-angle-right arrow"></i></a>
        <a href="profile.html"><i class="ico" style="background:#7ec8e3;"><i class="fas fa-map-marker-alt"></i></i><span>收货地址</span><i class="fas fa-angle-right arrow"></i></a>
        <a href="profile.html"><i class="ico" style="background:#b39ddb;"><i class="fas fa-ticket-alt"></i></i><span>优惠券</span><span class="val">6 张可用</span><i class="fas fa-angle-right arrow"></i></a>
        <a href="profile.html"><i class="ico" style="background:#9ccc65;"><i class="fas fa-headset"></i></i><span>联系客服</span><i class="fas fa-angle-right arrow"></i></a>
        <a href="profile.html"><i class="ico" style="background:#ffb74d;"><i class="fas fa-cog"></i></i><span>设置</span><i class="fas fa-angle-right arrow"></i></a>
    </div>

    <div class="tabbar">
        <a href="home.html"><i class="fas fa-home"></i><span>首页</span></a>
        <a href="category.html"><i class="fas fa-th-large"></i><span>分类</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span>购物车</span><span class="badge">3</span></a>
        <a href="order-list.html"><i class="fas fa-file-alt"></i><span>订单</span></a>
        <a href="profile.html" class="on"><i class="fas fa-user"></i><span>我的</span></a>
    </div>
</body>
</html>
