<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 芋道管理后台</title>
    <script src="../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../lib/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
        }
        .login-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: #409eff;
            box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.2);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background: #66b1ff;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #606266;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #409eff;
            border-bottom-color: #409eff;
        }
        .code-img {
            width: 160px;
            height: 160px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex">
        <!-- 左侧区域 -->
        <div class="hidden lg:flex lg:w-1/2 login-bg relative p-12 overflow-hidden">
            <div class="relative z-10">
                <!-- Logo 和标题 -->
                <div class="flex items-center text-white mb-12">
                    <div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center mr-4">
                        <i class="fas fa-cube text-blue-600 text-xl"></i>
                    </div>
                    <span class="text-2xl font-bold">芋道管理后台</span>
                </div>

                <!-- 欢迎内容 -->
                <div class="h-[calc(100%-120px)] flex items-center justify-center">
                    <div class="text-center">
                        <div class="mb-8">
                            <i class="fas fa-rocket text-white text-6xl opacity-80"></i>
                        </div>
                        <h2 class="text-3xl text-white font-bold mb-4">欢迎回来</h2>
                        <p class="text-white text-opacity-80 text-lg">企业级快速开发平台，助力企业数字化升级</p>
                    </div>
                </div>
            </div>

            <!-- 装饰背景 -->
            <div class="absolute inset-0 opacity-10">
                <div class="absolute top-20 left-20 w-40 h-40 bg-white rounded-full"></div>
                <div class="absolute bottom-20 right-20 w-60 h-60 bg-white rounded-full"></div>
            </div>
        </div>

        <!-- 右侧登录区域 -->
        <div class="flex-1 flex items-center justify-center p-8 bg-white">
            <div class="w-full max-w-md">
                <!-- 移动端 Logo -->
                <div class="lg:hidden flex items-center justify-center mb-8">
                    <div class="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center mr-3">
                        <i class="fas fa-cube text-white text-xl"></i>
                    </div>
                    <span class="text-xl font-bold text-gray-800">芋道管理后台</span>
                </div>

                <!-- 登录表单 -->
                <div class="bg-white rounded-2xl shadow-xl p-8">
                    <h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">账号登录</h3>

                    <!-- Tab 切换 -->
                    <div class="flex border-b mb-6">
                        <button class="tab-btn active" onclick="switchTab(this, 'account')">账号登录</button>
                        <button class="tab-btn" onclick="switchTab(this, 'mobile')">手机登录</button>
                        <button class="tab-btn" onclick="switchTab(this, 'qrcode')">扫码登录</button>
                    </div>

                    <!-- 账号登录表单 -->
                    <form id="accountForm" onsubmit="handleLogin(event)">
                        <div class="mb-4">
                            <input type="text" class="form-input" placeholder="请输入账号" value="admin">
                        </div>
                        <div class="mb-4">
                            <input type="password" class="form-input" placeholder="请输入密码" value="admin123">
                        </div>
                        <div class="flex items-center justify-between mb-6">
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2">
                                <span class="text-sm text-gray-600">记住密码</span>
                            </label>
                            <a href="#" class="text-sm text-blue-600 hover:underline">忘记密码？</a>
                        </div>
                        <button type="submit" class="btn-primary">登录</button>
                    </form>

                    <!-- 手机登录表单 -->
                    <form id="mobileForm" class="hidden" onsubmit="handleMobileLogin(event)">
                        <div class="mb-4">
                            <input type="tel" class="form-input" placeholder="请输入手机号">
                        </div>
                        <div class="mb-4 flex gap-2">
                            <input type="text" class="form-input flex-1" placeholder="请输入验证码">
                            <button type="button" class="px-4 bg-blue-600 text-white rounded hover:bg-blue-700">获取验证码</button>
                        </div>
                        <button type="submit" class="btn-primary">登录</button>
                    </form>

                    <!-- 扫码登录 -->
                    <div id="qrcodeForm" class="hidden text-center py-8">
                        <div class="code-img mb-4">
                            <i class="fas fa-qrcode text-6xl text-gray-400"></i>
                        </div>
                        <p class="text-gray-600 mb-2">请使用微信扫码登录</p>
                        <p class="text-sm text-gray-400">打开微信扫一扫，快速登录</p>
                    </div>

                    <!-- 其他登录方式 -->
                    <div class="mt-6 text-center">
                        <div class="relative mb-4">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-200"></div>
                            </div>
                            <div class="relative flex justify-center">
                                <span class="px-4 bg-white text-sm text-gray-500">其他登录方式</span>
                            </div>
                        </div>
                        <div class="flex justify-center space-x-4">
                            <a href="#" class="w-10 h-10 rounded-full bg-green-500 text-white flex items-center justify-center hover:bg-green-600">
                                <i class="fab fa-weixin"></i>
                            </a>
                            <a href="#" class="w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center hover:bg-blue-600">
                                <i class="fab fa-qq"></i>
                            </a>
                            <a href="#" class="w-10 h-10 rounded-full bg-red-500 text-white flex items-center justify-center hover:bg-red-600">
                                <i class="fab fa-weibo"></i>
                            </a>
                        </div>
                    </div>

                    <!-- 注册链接 -->
                    <div class="mt-6 text-center">
                        <span class="text-sm text-gray-600">还没有账号？</span>
                        <a href="#" class="text-sm text-blue-600 hover:underline ml-1">立即注册</a>
                    </div>
                </div>

                <!-- 底部信息 -->
                <div class="mt-8 text-center text-sm text-gray-400">
                    <p>© 2024 芋道管理后台 - All Rights Reserved</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab 切换
        function switchTab(element, tab) {
            // 移除所有 active 类
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            // 添加当前 active 类
            element.classList.add('active');

            // 隐藏所有表单
            document.getElementById('accountForm').classList.add('hidden');
            document.getElementById('mobileForm').classList.add('hidden');
            document.getElementById('qrcodeForm').classList.add('hidden');

            // 显示对应表单
            if (tab === 'account') {
                document.getElementById('accountForm').classList.remove('hidden');
            } else if (tab === 'mobile') {
                document.getElementById('mobileForm').classList.remove('hidden');
            } else {
                document.getElementById('qrcodeForm').classList.remove('hidden');
            }
        }

        // 处理登录
        function handleLogin(event) {
            event.preventDefault();
            // 跳转到首页
            window.location.href = 'home.html';
        }

        // 处理手机登录
        function handleMobileLogin(event) {
            event.preventDefault();
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
