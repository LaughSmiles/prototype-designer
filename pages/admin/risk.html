<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敏感词风控 - 拾光社区</title>
    <script src="../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../lib/css/all.min.css">
    <link rel="stylesheet" href="../../css/sidebar-menu.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
        .sidebar { width: 210px; height: 100vh; background: #001529; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100; }
        .sidebar .logo { height: 50px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar .logo .logo-icon { width: 32px; height: 32px; border-radius: 6px; background: #409eff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .sidebar .logo .logo-text { color: #fff; font-size: 14px; font-weight: 600; margin-left: 10px; white-space: nowrap; }
        .topbar { height: 50px; background: #fff; border-bottom: 1px solid #e8e8e8; position: fixed; top: 0; left: 210px; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 99; }
        .topbar-left { display: flex; align-items: center; gap: 16px; }
        .topbar-right { display: flex; align-items: center; gap: 18px; color: #606266; font-size: 14px; }
        .breadcrumb { font-size: 14px; color: #909399; }
        .breadcrumb .last { color: #303133; font-weight: 500; }
        .breadcrumb-sep { margin: 0 6px; color: #dcdfe6; }
        .main-content { margin-left: 210px; margin-top: 50px; padding: 16px; min-height: calc(100vh - 50px); }
        .card { background: #fff; border-radius: 4px; padding: 18px 20px; margin-bottom: 12px; }
        .search-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
        .search-item { display: flex; flex-direction: column; gap: 6px; }
        .search-item label { font-size: 13px; color: #606266; }
        .input, select.input { height: 32px; padding: 0 10px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; outline: none; color: #606266; background: #fff; }
        .input:focus { border-color: #409eff; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .toolbar-left { display: flex; gap: 8px; }
        .btn { height: 32px; padding: 0 15px; border-radius: 4px; border: 1px solid #dcdfe6; background: #fff; font-size: 13px; color: #606266; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all .2s; }
        .btn:hover { color: #409eff; border-color: #c6e2ff; background: #ecf5ff; }
        .btn-primary { background: #409eff; border-color: #409eff; color: #fff; }
        .btn-primary:hover { background: #66b1ff; border-color: #66b1ff; color: #fff; }
        .btn-danger { background: #f56c6c; border-color: #f56c6c; color: #fff; }
        .btn-danger:hover { background: #f78989; border-color: #f78989; color: #fff; }
        .btn-success { background: #67c23a; border-color: #67c23a; color: #fff; }
        .btn-success:hover { background: #85ce61; border-color: #85ce61; color: #fff; }
        .btn-warning { background: #e6a23c; border-color: #e6a23c; color: #fff; }
        .btn-warning:hover { background: #ebb563; border-color: #ebb563; color: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #fafafa; text-align: left; padding: 12px; font-weight: 500; color: #303133; border-bottom: 1px solid #ebeef5; white-space: nowrap; }
        td { padding: 12px; border-bottom: 1px solid #ebeef5; color: #606266; vertical-align: middle; }
        tbody tr:hover { background: #f5f7fa; }
        .tag { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 12px; line-height: 20px; }
        .tag-success { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
        .tag-info { background: #f4f4f5; color: #909399; border: 1px solid #e9e9eb; }
        .tag-danger { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
        .tag-warning { background: #fdf6ec; color: #e6a23c; border: 1px solid #faecd8; }
        .link { color: #409eff; cursor: pointer; margin-right: 8px; }
        .link:hover { text-decoration: underline; }
        .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: #606266; }
        .page-btn { min-width: 30px; height: 30px; padding: 0 6px; border: 1px solid #dcdfe6; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; color: #606266; }
        .page-btn.active { background: #409eff; border-color: #409eff; color: #fff; }
        .cell-flex { display: flex; align-items: center; gap: 10px; }
        .thumb { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: #eee; }
        .avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .meta { display: flex; flex-direction: column; gap: 2px; }
        .meta .name { color: #303133; font-weight: 500; }
        .meta .sub { color: #c0c4cc; font-size: 12px; }
        .ops { white-space: nowrap; }
        .heatbar { width: 84px; height: 6px; border-radius: 3px; background: #f0f2f5; overflow: hidden; }
        .heatbar span { display: block; height: 100%; background: #ff2442; }
    </style>
</head>
<body>
    <!-- 左侧菜单 - 动态菜单 -->
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-book-open text-white text-sm"></i></div>
            <span class="logo-text">拾光社区运营后台</span>
        </div>
        <div id="sidebar-menu"></div>
    </div>

    <!-- 顶栏 -->
    <div class="topbar">
        <div class="topbar-left">
            <div title="折叠菜单"><i class="fas fa-outdent" style="font-size: 18px; color: #606266; cursor: pointer;"></i></div>
            <div class="breadcrumb">
                <span>社区运营</span><span class="breadcrumb-sep">/</span><span>用户与风控</span><span class="breadcrumb-sep">/</span><span class="last">敏感词风控</span>
            </div>
        </div>
        <div class="topbar-right">
            <i class="fas fa-search" style="cursor: pointer;"></i>
            <i class="fas fa-bell" style="cursor: pointer;"></i>
            <i class="fas fa-expand" id="fullscreenBtn" style="cursor: pointer;" title="全屏"></i>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 28px; height: 28px; border-radius: 50%; background: #409eff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px;">运</div>
                <span>运营管理员</span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <!-- 搜索区 -->
        <div class="card">
            <div class="search-row">
                <div class="search-item">
                    <label>敏感词</label>
                    <input class="input" type="text" placeholder="请输入敏感词" style="width: 190px;">
                </div>
                <div class="search-item">
                    <label>词库分类</label>
                    <select class="input" style="width: 130px;"><option>全部分类</option><option>政治</option><option>色情</option><option>广告</option><option>辱骂</option><option>其他</option></select>
                </div>
                <button class="btn btn-primary"><i class="fas fa-search"></i>搜索</button>
                <button class="btn"><i class="fas fa-redo"></i>重置</button>
            </div>
        </div>

        <!-- 表格区 -->
        <div class="card">
            <div class="toolbar">
                <div class="toolbar-left">
                    <button class="btn btn-primary"><i class="fas fa-plus"></i>新增敏感词</button>
                    <button class="btn btn-success"><i class="fas fa-file-import"></i>导入</button>
                    <button class="btn btn-warning"><i class="fas fa-file-export"></i>导出</button>
                    <button class="btn btn-danger"><i class="fas fa-trash-alt"></i>批量删除</button>

                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn"><i class="fas fa-sync-alt"></i></button>
                    <button class="btn"><i class="fas fa-cog"></i></button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 40px;"><input type="checkbox"></th>
                        <th>敏感词</th>
                        <th>词库分类</th>
                        <th>命中次数</th>
                        <th>处置动作</th>
                        <th>状态</th>
                        <th>更新时间</th>
                        <th style="width: 180px;">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>加微信</td>
                        <td>广告</td>
                        <td>18,204</td>
                        <td><span class="tag tag-danger">拦截</span></td>
                        <td><span class="tag tag-success">启用</span></td>
                        <td>2026-09-18 10:22</td>
                        <td class="ops"><a class="link">详情</a><a class="link">编辑</a><a class="link" style="color:#f56c6c;">删除</a></td>
                    </tr>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>低价出票</td>
                        <td>广告</td>
                        <td>9,860</td>
                        <td><span class="tag tag-danger">拦截</span></td>
                        <td><span class="tag tag-success">启用</span></td>
                        <td>2026-09-17 16:05</td>
                        <td class="ops"><a class="link">详情</a><a class="link">编辑</a><a class="link" style="color:#f56c6c;">删除</a></td>
                    </tr>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>vx 同步</td>
                        <td>广告</td>
                        <td>6,412</td>
                        <td><span class="tag tag-warning">审核后放行</span></td>
                        <td><span class="tag tag-success">启用</span></td>
                        <td>2026-09-16 09:41</td>
                        <td class="ops"><a class="link">详情</a><a class="link">编辑</a><a class="link" style="color:#f56c6c;">删除</a></td>
                    </tr>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>私聊有偿</td>
                        <td>广告</td>
                        <td>3,077</td>
                        <td><span class="tag tag-info">仅告警</span></td>
                        <td><span class="tag tag-success">启用</span></td>
                        <td>2026-09-15 14:30</td>
                        <td class="ops"><a class="link">详情</a><a class="link">编辑</a><a class="link" style="color:#f56c6c;">删除</a></td>
                    </tr>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>刷单兼职</td>
                        <td>其他</td>
                        <td>1,204</td>
                        <td><span class="tag tag-danger">拦截</span></td>
                        <td><span class="tag tag-info">停用</span></td>
                        <td>2026-08-12 11:12</td>
                        <td class="ops"><a class="link">详情</a><a class="link">编辑</a><a class="link" style="color:#f56c6c;">删除</a></td>
                    </tr>
                </tbody>
            </table>

            <div class="pagination">
                <span>共 4,820 条</span>
                <select class="input" style="width: 96px;"><option>10 条/页</option><option>20 条/页</option></select>
                <button class="page-btn"><i class="fas fa-angle-left"></i></button>
                <button class="page-btn active">1</button>
                <button class="page-btn">2</button>
                <button class="page-btn">3</button>
                <button class="page-btn">…</button>
                <button class="page-btn">13</button>
                <button class="page-btn"><i class="fas fa-angle-right"></i></button>
            </div>
        </div>

    </div>

    <!-- 框架脚本：顺序不可调换（menu 数据 → 引擎 → Debug → 页面能力） -->
    <script src="../../menu/menu.js"></script>
    <script src="../../js/menu/menu-data.js"></script>
    <script src="../../js/menu/menu-render.js"></script>
    <script src="../../js/menu/menu-interaction.js"></script>
    <script src="../../js/menu/menu.js"></script>
    <script src="../../js/debug.js"></script>
    <script src="../../js/topbar.js"></script>
    <script src="../../js/page-fields-config.js"></script>
    <script src="../../js/prototype-components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                await SidebarMenu.init('sidebar-menu');
            } catch (error) {
                console.error('动态菜单初始化失败:', error);
            }
        });
    </script>
</body>
</html>
