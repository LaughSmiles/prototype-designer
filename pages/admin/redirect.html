<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中... - 芋道管理后台</title>
    <script src="../../lib/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="../../lib/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #409eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .pulse-text { animation: pulse 1.5s ease-in-out infinite; }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center bg-gray-50">
        <div class="text-center">
            <div class="spinner mx-auto mb-6"></div>
            <p class="text-lg text-gray-600 pulse-text">正在跳转中，请稍候...</p>
        </div>
    </div>
    <script>
        // 从 URL 参数获取重定向地址
        const params = new URLSearchParams(window.location.search);
        const redirectUrl = params.get('redirect') || 'home.html';
        setTimeout(() => {
            window.location.href = redirectUrl;
        }, 1000);
    </script>
</body>
</html>
