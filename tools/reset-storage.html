<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>本地存储重置</title>
    <style>
        body { font: 14px/1.8 -apple-system, "Microsoft YaHei", sans-serif; padding: 32px; max-width: 760px; }
        button { font-size: 15px; padding: 8px 16px; margin: 0 8px 8px 0; cursor: pointer; }
        table { border-collapse: collapse; margin-top: 16px; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; font-size: 13px; }
        th { background: #f5f5f5; }
        code { background: #f0f0f0; padding: 1px 5px; border-radius: 3px; }
        .ok { color: #67c23a; } .warn { color: #e6a23c; }
    </style>
</head>
<body>
    <h2>本地存储重置（浏览器联调辅助）</h2>
    <p>本页面只操作当前 origin 的 localStorage，不涉及任何项目数据文件。</p>

    <p>
        <button id="list">列出全部键</button>
        <button id="clearAll">清空全部</button>
        <button id="clearCanvas">仅清画布数据 + UI 状态</button>
    </p>

    <div id="out">点击上方按钮。</div>

    <script>
        const out = document.getElementById('out');

        function render(html) { out.innerHTML = html; }

        function list() {
            const rows = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                const v = localStorage.getItem(k) || '';
                rows.push(`<tr><td><code>${k}</code></td><td>${v.length} 字符 (${(v.length * 2 / 1048576).toFixed(3)} MB)</td></tr>`);
            }
            render(`<p>共 ${localStorage.length} 个键：</p><table><tr><th>键</th><th>大小</th></tr>${rows.join('')}</table>`);
        }

        // 与 Storage.getManagedKeys() 保持一致（含遗留键名）
        const MANAGED = ['canvasEditor_theme', 'sidebarMenuExpanded', 'topbar_fullscreen',
            'prototypeFullscreenState', 'prototype_open_tabs',
            'photographySchoolCanvas', 'photographySchool_uiState'];

        document.getElementById('list').addEventListener('click', list);

        document.getElementById('clearAll').addEventListener('click', () => {
            localStorage.clear();
            render('<p class="ok">✓ 已清空全部 localStorage</p>');
        });

        document.getElementById('clearCanvas').addEventListener('click', () => {
            const removed = [];
            for (let i = localStorage.length - 1; i >= 0; i--) {
                const k = localStorage.key(i);
                // 画布主键与 UI 状态键带项目名前缀，其余是框架级 UI 键
                if (k.endsWith('Canvas') || k.endsWith('_uiState') || MANAGED.includes(k)) {
                    localStorage.removeItem(k);
                    removed.push(k);
                }
            }
            render(`<p class="ok">✓ 已清除 ${removed.length} 项：${removed.map(k => `<code>${k}</code>`).join('、') || '（无）'}</p>`);
        });

        list();
    </script>
</body>
</html>
